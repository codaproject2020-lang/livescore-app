<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15284d">
<title>LIVE UP · 실시간 스코어</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-512.png?v=345">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=345">
<link rel="icon" href="/icon-192.png?v=345">
<style>
:root{
  --bg:#ffffff; --navy:#142748; --navy2:#223a63;
  --red:#df123b; --green:#1ca65a; --amber:#f0a500;
  --soft:#f3f5f9; --soft2:#eef1f6; --line:#e5e9f0; --muted:#8a93a3;
  --shadow:0 2px 10px rgba(21,40,77,.06);
  --maxw:720px; --safe-b:env(safe-area-inset-bottom,0px);
}
/* 🌙 다크 테마 — 변수만 재정의하면 변수 기반 컴포넌트가 전체 전환 */
html[data-theme="dark"]{
  --bg:#121a28; --navy:#e9eef7; --navy2:#c6d1e4;
  --soft:#1b2639; --soft2:#232f46; --line:#2c3a54; --muted:#95a1b8;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
html[data-theme="dark"] body{background:#0c111b}
html[data-theme="dark"] .fbrow .posbar,html[data-theme="dark"] .stbar .tr{background:#2c3a54}
/* 🔤 글자 크기(비율 확대 — 레이아웃 비례 유지로 잘림 방지) */
html.fs-large{zoom:1.12} html.fs-xl{zoom:1.24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--soft);color:var(--navy);line-height:1.45;-webkit-text-size-adjust:100%}
.app{max-width:var(--maxw);margin:0 auto;background:var(--bg);min-height:100vh;position:relative;
  padding-bottom:calc(72px + var(--safe-b))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
.hide{display:none!important}

/* ===== 상단바 ===== */
.topbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;gap:10px;
  padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;color:var(--navy)}
.logo b{color:var(--red)}
.tagline{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:2px;white-space:nowrap}
.topbar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--navy);position:relative}
.iconbtn:active{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}

/* ===== 종목 탭 ===== */
.sporttabs{position:sticky;top:61px;z-index:29;background:#fff;display:flex;gap:4px;overflow-x:auto;
  padding:8px 10px 6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.sporttabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;min-width:60px;padding:4px 10px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted);font-size:12.5px;font-weight:700;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.stab .ic{font-size:22px;line-height:1}
.stab.on{color:var(--red);border-bottom-color:var(--red)}
.stab.on .ic{filter:none}

/* ===== 날짜바 ===== */
.datebar{display:flex;align-items:center;justify-content:center;gap:12px;padding:11px 16px;background:#fff;border-bottom:1px solid var(--line)}
.datebar .nav{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:17px}
.datebar .nav:active{background:var(--soft)}
.datebar .d{font-weight:800;font-size:16px}
.datebar .today{background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px}
.datebar .cal{color:var(--navy)}

/* ===== 빅매치 ===== */
.bigmatch{margin:14px 16px 6px;border-radius:16px;overflow:hidden;position:relative;color:#fff;box-shadow:var(--shadow)}
.bigmatch .bgwrap{position:absolute;inset:0;background-size:cover;background-position:center}
.bigmatch .bgwrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,38,.45),rgba(10,18,38,.72))}
.bigmatch .in{position:relative;padding:18px 16px 20px}
.bm-top{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:12px}
.bm-top .wreath{opacity:.9}
.bm-badge{position:absolute;left:14px;top:14px;background:var(--red);font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px}
.bm-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bm-team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bm-team img,.bm-team .ph{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.bm-team .ph{display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(255,255,255,.12);border-radius:50%}
.bm-team .nm{font-weight:800;font-size:14px;text-align:center;max-width:120px}
.bm-center{text-align:center;min-width:86px}
.bm-league{font-size:12px;font-weight:700;opacity:.92;margin-bottom:3px;display:flex;align-items:center;gap:5px;justify-content:center}
.bm-score{font-size:30px;font-weight:900;letter-spacing:1px}
.bm-time{font-size:26px;font-weight:900}
.bm-state{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.bm-state.live{background:var(--green)}
.bm-cta{display:inline-flex;align-items:center;gap:5px;margin-top:13px;background:var(--red);color:#fff;font-weight:800;
  font-size:13px;padding:8px 16px;border-radius:999px}

/* ===== 필터 ===== */
.filters{display:flex;gap:8px;padding:12px 16px 4px}
.cbar{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cbar::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;cursor:pointer}
.cchip span{font-size:12.5px}
.cchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cchip i.cn{font-style:normal;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.08);color:inherit;border-radius:8px;padding:0 5px;margin-left:2px}
.cchip.on i.cn{background:rgba(255,255,255,.25)}
.lgbar{padding-top:2px}
.rk-ctrl{padding:4px 0 8px;border-bottom:1px solid var(--line)}
.rk-chips{display:flex;gap:7px;overflow-x:auto;padding:6px 16px 2px;scrollbar-width:none}
.rk-chips::-webkit-scrollbar{display:none}
.rk-chips.se .cchip{font-size:12px;padding:5px 11px}
.rk-ttl{font-weight:800;font-size:15px;padding:12px 16px 2px;color:var(--navy)}
.rk-note{font-size:11.5px;color:var(--muted);padding:0 16px 8px}
.rkgrp{font-weight:800;font-size:12.5px;color:var(--muted);padding:12px 16px 4px;background:var(--soft)}
.rank .rkhi{background:#fff6da}
.rank .rkhi td{font-weight:800}
.rank .rkrow td.tm{white-space:nowrap}
/* ===== 메뉴 실화면 공통 디자인(명령서 07~11) ===== */
.sv-wrap{padding:4px 16px 46px}
.sv-sec{margin-top:20px}
.sv-sh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--navy);margin:0 0 10px 2px}
.sv-sh::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px;flex:0 0 auto}
.sv-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sv-row{display:flex;align-items:center;gap:10px;padding:15px 16px;border-top:1px solid var(--line);font-size:14.5px}
.sv-row:first-child{border-top:none}
.sv-row .sl{font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;min-width:0}
.sv-row .sl .si{font-size:17px;width:20px;text-align:center;flex:0 0 auto}
.sv-row .sr{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.sv-row .chev{color:#c3c9d4;font-size:17px}
.sv-row.tap{cursor:pointer}
.sv-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sv-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 4px 11px;text-align:center}
.sv-stat .si{font-size:19px}
.sv-stat .sn{font-size:21px;font-weight:800;color:var(--red);margin-top:4px;line-height:1}
.sv-stat .st{font-size:11.5px;color:var(--navy);font-weight:700;margin-top:5px}
.sv-prof{display:flex;align-items:center;gap:14px;padding:18px 2px 20px}
.sv-av{width:66px;height:66px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;flex:0 0 auto}
.sv-av .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.sv-editb{margin-top:8px;border:1.4px solid var(--red);color:var(--red);background:#fff;border-radius:999px;padding:6px 15px;font-size:13px;font-weight:800}
.seg2{display:inline-flex;gap:8px;flex-wrap:wrap}
.segb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 17px;font-size:13px;font-weight:700;color:var(--navy)}
.segb.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* R020: 환경설정 터치 영역 ≥44px */
#segTheme .segb,#segFont .segb{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
#segTheme,#segFont{gap:10px}
.sv-sub{font-size:12px;color:var(--muted);margin:4px 0 0 2px}
.sv-btn-primary{width:100%;background:var(--navy);color:#fff;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.sv-btn-outline{width:100%;background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:13px;padding:14px;font-size:14.5px;font-weight:800}
.sv-foot{text-align:center;color:#b3b9c4;font-size:12px;margin-top:16px}
.sv-foot b{color:var(--red);font-weight:800}
/* 알림함(07) */
.ib-tabs{display:flex;align-items:center;gap:18px;padding:10px 4px 2px;border-bottom:1px solid var(--line)}
.ib-tab{font-size:15px;font-weight:800;color:#aeb4c0;padding:6px 0 10px;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:6px}
.ib-tab.on{color:var(--navy);border-color:var(--navy)}
.ib-badge{background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:0 6px;min-width:17px;text-align:center}
.ib-readall{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}
.ib-when{font-size:13px;font-weight:800;color:var(--muted);margin:16px 2px 8px}
.ib-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.ib-item.unread{background:#eef4ff;border-color:#dbe6ff}
.ib-ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.ib-tx{min-width:0;flex:1}
.ib-tx .tt{font-weight:800;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:6px}
.ib-tx .tt .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto}
.ib-tx .ds{font-size:13px;color:#5a6274;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-tx .lg{font-size:11.5px;color:var(--muted);margin-top:3px}
.ib-time{font-size:11.5px;color:#aeb4c0;white-space:nowrap;align-self:flex-start;margin-top:2px}
.ib-chev{color:#c3c9d4;font-size:18px;align-self:center}
/* 저장 콘텐츠·뉴스(09·뉴스) */
.sv-save{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;padding:0}
.sv-save img{width:92px;height:68px;object-fit:cover;flex:0 0 auto;background:var(--soft)}
.sv-save .sc{padding:11px 10px;min-width:0;flex:1}
.sv-save .sc .tt{font-weight:800;font-size:13.5px;color:var(--navy);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sv-save .sc .mt{font-size:12px;color:var(--red);font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px}
.sv-save .sc .mt.gray{color:var(--muted)}
.news-seg{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.news-seg::-webkit-scrollbar{display:none}
/* 공유 바텀시트(10) */
.sh-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18);max-width:520px;margin:0 auto;z-index:60}
.sh-grab{width:42px;height:4px;border-radius:999px;background:#dfe3ea;margin:4px auto 14px}
.sh-head{display:flex;align-items:center;margin-bottom:16px}
.sh-head .tt{font-weight:800;font-size:19px;color:var(--navy)}
.sh-head .x{margin-left:auto;font-size:22px;color:#9aa1ad;background:none;border:none}
.sh-card{display:flex;align-items:center;gap:13px;background:var(--soft);border-radius:14px;padding:13px;margin-bottom:16px}
.sh-logo{width:78px;height:60px;border-radius:11px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;font-weight:900;font-size:13px;letter-spacing:.5px}
.sh-aux-t{text-align:center;font-size:12px;color:#aeb4c0;font-weight:700;margin:4px 0 12px;position:relative}
.sh-aux{display:flex;justify-content:space-around;margin-bottom:14px}
.sh-aux button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--navy)}
.sh-aux .ic{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px}
.sh-link{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:12px;padding:13px 14px;font-weight:800;color:var(--navy);font-size:14px}
.sh-mask{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:59}
/* 🎬 하이라이트 */
.hl-wrap{padding:14px 16px 24px}
.hl-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.hl-player iframe,.hl-player #ytp{width:100%;height:100%;border:0;display:block}
/* 🎥 라이브 트래커 위젯 */
.trk-wrap{width:100%;background:#0b1220;border-radius:12px;overflow:hidden;margin:2px 0 8px}
.trk-frame{width:100%;height:420px;border:0;display:block;background:#0b1220}
@media(min-width:560px){.trk-frame{height:480px}}
.hl-thumb{position:absolute;inset:0;background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hl-thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
.hl-play{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:rgba(229,9,20,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px}
.hl-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.hl-fallback .big{font-size:34px;opacity:.8}
.hl-meta{margin-top:12px}
.hl-ti{font-weight:800;font-size:15px;color:var(--navy);line-height:1.4}
.hl-ch{font-size:13px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:7px}
.hl-off{background:#e8f6ec;color:#1a9a4b;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.hl-link{display:inline-flex;align-items:center;gap:4px;margin-top:12px;background:var(--navy);color:#fff;border-radius:11px;padding:11px 16px;font-weight:800;font-size:14px;text-decoration:none}
.hl-note{font-size:11.5px;color:var(--muted);margin-top:12px}
.fbtn{flex:1;padding:11px 8px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--navy)}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ===== 실시간 경기 헤더 ===== */
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sec-h .t{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec-h .t:before{content:"";width:4px;height:17px;background:var(--red);border-radius:2px}
.recv{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.recv .g{width:7px;height:7px;border-radius:50%;background:var(--green)}
.refbtn{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:12.5px;color:var(--navy);display:inline-flex;align-items:center;gap:4px}
.ov-jump{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.ovj{flex:1 1 auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:800;font-size:12.5px;color:var(--navy);cursor:pointer}
.ovj:active{background:var(--soft2)}
.ins-wrap{margin-top:10px}
.ins-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.ins-row:active{background:var(--soft)}
.ins-row .il{font-weight:700;font-size:13.5px;color:var(--navy)}
.ins-row .il b{color:var(--red);margin:0 3px}
.ins-row .ir{font-size:11.5px;color:var(--muted);white-space:nowrap}
.refbtn:active{background:var(--soft2)}
.refbtn[disabled]{opacity:.55}
.recvt{font-size:11px;color:var(--muted);margin-left:7px}

/* ===== 리그 그룹 ===== */
.league{margin:10px 16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.lg-h{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--soft);font-weight:800;font-size:13.5px}
.lg-h img,.lg-h .lph{width:22px;height:22px;object-fit:contain}
.lg-h .lph{display:flex;align-items:center;justify-content:center;font-size:15px;background:#fff;border-radius:6px}
.lg-h>span:not(.chev){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-h .lgcnt{font-style:normal;font-size:11px;color:var(--muted);font-weight:700;flex:0 0 auto;margin-right:2px}
.lg-h .lgcnt .lv{color:var(--red);font-weight:800}
.lg-h .lgpin{position:relative;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.lg-h .lgpin.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lg-h .lgpin:active{opacity:.8}
.lg-h .lgpin::after,.lg-h .lgcol::after{content:"";position:absolute;inset:-9px}
.lg-h .lgcol{position:relative;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.lg-h .lgcol:active{background:#e6eaf2}
.lg-h .chev{color:var(--muted);transition:transform .15s;flex:0 0 auto}
.lg-h.collapsed .chev{transform:rotate(-90deg)}
.lg-body.collapsed{display:none}

/* ===== 경기 카드 ===== */
.gm{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:8px;padding:12px 12px;border-top:1px solid var(--line);min-height:62px}
.gm:first-child{border-top:none}
/* 2행 카드(C01~C03) */
.gm2{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:8px;padding:10px 10px;border-top:1px solid var(--line);position:relative;cursor:pointer}
.gm2:first-child{border-top:none}
.gm2 .g2stat{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.gm2 .g2time{font-size:14px;font-weight:800;color:var(--navy)}
.gm2 .g2st{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.25;word-break:keep-all}
.gm2 .g2st.live{color:var(--red)}
.gm2 .g2st .lc,.gm2 .g2st .fc{color:var(--red)}
.gm2 .g2teams{display:flex;flex-direction:column;gap:7px;min-width:0}
.gm2 .g2row{display:flex;align-items:center;gap:8px;min-width:0}
.gm2 .g2lg{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.gm2 .g2lg.ph{display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--soft);border-radius:50%}
.gm2 .g2nm{flex:1;min-width:0;font-weight:700;font-size:13.5px;line-height:1.25;white-space:normal;word-break:break-word}
.gm2 .g2sc{flex:0 0 auto;font-weight:900;font-size:17px;color:var(--navy);min-width:20px;text-align:right}
.gm2 .g2sc.red{color:var(--red)}
.gm2 .g2row .ha{margin-top:0;flex:0 0 auto}
.gm2 .fav{position:static;align-self:center}
.gm2 .gm-sub{grid-column:1/-1}
.gm .side{display:flex;align-items:center;gap:9px;min-width:0}
.gm .side.away{flex-direction:row-reverse;text-align:right}
.gm .side img,.gm .side .tph{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.gm .side .tph{display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--soft);border-radius:50%}
.gm .side .tn{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm .mid{text-align:center;min-width:66px}
.gm .sc{font-size:19px;font-weight:900}
.gm .sc.red{color:var(--red)}
.gm .st{font-size:11px;font-weight:800;margin-top:3px;display:inline-block;padding:2px 7px;border-radius:999px;background:var(--soft2);color:var(--muted)}
.gm .st.live{background:var(--green);color:#fff}
.gm .tt{font-size:16px;font-weight:800;color:var(--navy)}
.gm .subt{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.fav{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#c9d0db;font-size:20px;flex:0 0 auto}
.fav.on{color:var(--amber)}
/* 보조 라인(라인스코어/세트/BSO) */
.gm-sub{grid-column:1/-1;padding:2px 2px 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.chipq{font-size:11px;font-weight:700;color:var(--text);background:var(--soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.fbflow{margin:4px 0 6px}
.fbflow-svg{width:100%;height:auto;display:block}
.fbflow-lg{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px;font-size:11px;font-weight:700;color:var(--muted)}
.fbflow-lg span{display:inline-flex;align-items:center;gap:4px}
.fbflow-lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.fbflow-lg .mut{color:#9aa6b6;font-weight:600}
.lgwrap{display:flex;align-items:center;gap:2px}
.lgwrap .cbar{flex:1;min-width:0}
.lg-all{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:32px;margin-right:12px;border:1px solid var(--line);background:var(--card,#fff);border-radius:9px;color:var(--navy);cursor:pointer}
.lg-all svg{width:18px;height:18px}
html[data-theme="dark"] .lg-all{background:#1b2740;border-color:#2c3a54}
.lb-search{padding:4px 2px 8px}.lb-search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--soft)}
.lb-gender{display:flex;gap:6px;margin-bottom:8px}
.lb-gender button{flex:1;border:1px solid var(--line);background:var(--card,#fff);border-radius:16px;padding:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.lb-gender button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lb-sec{font-size:11.5px;font-weight:800;color:#8a93a3;margin:12px 0 4px;padding-left:2px}
.lb-row{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;text-align:left}
.lb-row.sel{background:rgba(223,18,59,.05)}
.lb-ic{font-size:17px;width:22px;text-align:center;flex:none}
.lb-nm{flex:1;min-width:0}.lb-nm b{display:block;font-size:14px;font-weight:800;color:var(--text)}.lb-nm i{display:block;font-style:normal;font-size:11.5px;color:#8a93a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-n{font-size:12px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:10px;padding:2px 9px;flex:none}
.lb-ck{color:var(--red);font-weight:900;flex:none}
/* 전체 경기 보기 버튼(홈) + 전체 경기 탐색 화면(A01~A10) */
.allg-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:calc(100% - 24px);margin:8px 12px 2px;padding:11px;border:1px solid var(--line);background:var(--card,#fff);border-radius:12px;font-weight:800;font-size:13.5px;color:var(--navy);cursor:pointer;min-height:44px}
.allg-btn:active{background:var(--soft)}
.allg-btn .ab-ic{font-size:16px}
.ag-ctrl{position:sticky;top:0;background:var(--bg);z-index:5;padding:6px 0 6px;border-bottom:1px solid var(--line)}
.ag-sports{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 7px;-webkit-overflow-scrolling:touch}
.ag-sports::-webkit-scrollbar{display:none}
.ag-sp{flex:none;border:1px solid var(--line);background:var(--card,#fff);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;color:var(--navy);cursor:pointer;min-height:38px;white-space:nowrap}
.ag-sp.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ag-datebar{display:flex;align-items:center;gap:8px;padding:2px 2px 7px}
.ag-datebar .ag-dnav{border:1px solid var(--line);background:var(--card,#fff);border-radius:9px;width:38px;height:38px;font-size:17px;font-weight:800;color:var(--navy);cursor:pointer;flex:none}
.ag-datebar .ag-dlabel{flex:1;text-align:center;font-weight:800;font-size:13.5px;color:var(--text)}
.ag-datebar .ag-today{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:0 11px;height:38px;font-size:12px;font-weight:800;color:var(--navy);cursor:pointer;flex:none}
.ag-filt{display:flex;gap:8px;padding:0 2px 6px}
.ag-filt .agf{flex:1;border:1px solid var(--line);background:var(--card,#fff);border-radius:9px;padding:0 10px;height:40px;font-size:13px;font-weight:800;color:var(--navy);cursor:pointer}
.ag-filt .agf.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ag-lgrow{border-bottom:1px solid var(--line)}
.ag-lgh{display:flex;align-items:center;gap:9px;padding:11px 4px;cursor:pointer;min-height:48px}
.ag-lgh img{width:22px;height:22px;object-fit:contain;flex:none}
.ag-lgh .lph{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ag-lgh .ag-lgnm{flex:1;min-width:0}
.ag-lgh .ag-lgnm b{display:block;font-size:13.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-lgh .ag-lgnm i{display:block;font-style:normal;font-size:11px;color:#8a93a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-cnts{display:flex;align-items:center;gap:5px;flex:none}
.ag-cnts .agc-l{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:9px;padding:2px 7px}
.ag-cnts .agc-t{font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:9px;padding:2px 7px}
.ag-lgh .ag-chev{font-size:14px;color:#b9c0cc;transition:transform .15s;flex:none}
.ag-lgrow.open .ag-chev{transform:rotate(180deg)}
.ag-lgbody{padding:0 0 6px}
.langbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card,#fff);border-radius:16px;padding:4px 8px 4px 7px;cursor:pointer;max-width:118px}
.langbtn .lfl{font-size:15px;line-height:1}
.langbtn .lnm{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn .lcv{width:13px;height:13px;color:#8a93a3;flex:none}
html[data-theme="dark"] .langbtn{background:#1b2740;border-color:#2c3a54}
.vb-cur{font-size:11.5px;font-weight:900;color:#fff;background:var(--red);border-radius:6px;padding:2px 9px;white-space:nowrap}
.vb-cur b{font-weight:900;margin-right:3px;opacity:.92}
table.vbset td.vbset-cur{color:var(--red);font-weight:900;background:rgba(223,18,59,.06)}
.vb-curset{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef6ef;border:1px solid #cfe6d2;border-radius:10px;padding:10px 12px;margin:10px 0}
html[data-theme="dark"] .vb-curset{background:#17311f;border-color:#2b5a37}
.vb-curset-l{font-size:12px;font-weight:800;color:#1aa65a}
.vb-curset-r{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.vb-curset-r em{font-style:normal;color:var(--muted);font-size:11.5px;margin:0 4px}
.vb-curset-r b{font-size:19px}.vb-curset-r .sep{color:#8a93a3}
.vb-keyrec{display:flex;gap:10px}
.vb-keyrec .kr{flex:1;background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.vb-keyrec .kr .v{display:block;font-weight:900;font-size:17px}
.vb-keyrec .kr .l{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ov-links{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.ov-link{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--card,#fff);border-radius:10px;padding:11px 13px;font-weight:800;font-size:13.5px;color:var(--text);cursor:pointer}
.vb-h2h-sum{text-align:center;background:var(--soft);border-radius:10px;padding:9px;font-weight:700;font-size:13px;margin-bottom:10px}
.vb-grow{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.vb-grow-dt{min-width:70px;font-size:11px;color:#8a93a3}.vb-grow-dt span{display:block;font-size:10px}
.vb-grow-tm{flex:1;font-size:12.5px;font-weight:700}.vb-grow-tm b{margin:0 5px}
.rec-r{font-size:11px;font-weight:900;border-radius:5px;padding:2px 7px}
.rec-r.w{color:#1aa65a;background:#e7f6ec}.rec-r.l{color:var(--red);background:#fdecef}.rec-r.s{color:#64707f;background:var(--soft)}
table.rank tr.rk-hl{background:rgba(20,39,72,.06)}table.rank tr.rk-hl td{font-weight:800}
html[data-theme="dark"] table.rank tr.rk-hl{background:rgba(156,194,255,.1)}
.rk-lg{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:5px}
.chipq .qk{color:var(--muted);font-weight:800;margin-right:6px}
.pl-c{cursor:pointer}.pl.pl-c .pn{text-decoration:underline;text-decoration-color:rgba(43,91,181,.35)}.subchip.pl-c:active{opacity:.6}
.evsc{margin-left:auto;font-weight:900;color:var(--navy);background:var(--soft);border-radius:6px;padding:1px 7px;font-size:12px}
/* 전적 탭(#10) */
.rec-sum{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 4px;margin:4px 0 12px}
.rec-sum .rs{flex:1;text-align:center}
.rec-sum .rsn{font-size:19px;font-weight:900;color:var(--navy);line-height:1.1}
.rec-sum .rsl{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.rec-list{display:flex;flex-direction:column}
.rl-row{display:grid;grid-template-columns:48px 1fr auto 1fr 34px;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.rl-row .rl-dt{color:var(--muted);font-size:10.5px;line-height:1.2}.rl-row .rl-dt i{font-style:normal;font-size:9.5px;opacity:.8}
.rl-row .rl-tm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-row .rl-sc{font-weight:900;color:var(--navy);text-align:center}
.wdlc{display:inline-block;min-width:20px;text-align:center;font-size:11px;font-weight:900;color:#fff;border-radius:5px;padding:2px 5px}
.wdlc.w{background:var(--red)}.wdlc.d{background:#9aa1ad}.wdlc.l{background:var(--navy)}
.rec-form{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.rec-form .rf-nm{flex:1;font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdl-row{display:flex;gap:4px;flex:0 0 auto}
/* 01 오늘의 주요선수 */
.ov-stars{display:flex;flex-direction:column;gap:2px}
.star-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.star-row img,.star-row .av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.star-row .si{flex:1;min-width:0}
.star-row .sn{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star-row .sg{font-size:11.5px;color:var(--muted);margin-top:1px}
.star-row .sr{flex:0 0 auto;font-weight:900;font-size:15px;color:#fff;background:var(--red);border-radius:8px;padding:4px 9px;min-width:42px;text-align:center}
/* 09 팀 분석 */
.an-meta{font-size:11px;color:var(--muted);margin:0 0 8px}
.an-next{display:flex;flex-direction:column}
.an-nx{display:grid;grid-template-columns:30px 1fr auto auto auto;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.an-nx .an-lg img,.an-nx .an-lg .ph{width:24px;height:24px;object-fit:contain}
.an-nx .an-op{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.an-nx .an-op i{font-style:normal;color:var(--muted);font-size:11px}
.an-nx .an-ha{font-size:11px;color:var(--muted);font-weight:800}
.an-nx .an-dt{font-size:11px;color:var(--muted)}
.an-diff{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}
.an-diff.h{background:var(--red)}.an-diff.m{background:var(--amber)}.an-diff.e{background:var(--green)}
.an-legend{font-size:11px;color:var(--muted);margin-bottom:6px}.an-legend .lf{color:var(--navy)}.an-legend .la{color:var(--red)}
.an-chart{display:flex;gap:4px;align-items:flex-end;height:120px;padding:4px 0}
.an-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.an-bars{flex:1;display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center}
.an-bars .bf,.an-bars .ba{width:42%;border-radius:4px 4px 0 0;min-height:2px;position:relative;display:flex;justify-content:center}
.an-bars .bf{background:var(--navy)}.an-bars .ba{background:var(--red)}
.an-bars b{position:absolute;top:-14px;font-size:9px;color:var(--muted);font-weight:800}
.an-x{font-size:9px;color:var(--muted);margin-top:4px;transform:rotate(-30deg);white-space:nowrap}
/* 02 중앙 타임라인 */
.tl-chips{display:flex;gap:6px;padding:4px 0 12px;overflow-x:auto;scrollbar-width:none}.tl-chips::-webkit-scrollbar{display:none}
.tl-chips .fchip{flex:0 0 auto}
.tl{position:relative;padding:4px 0}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.tl-row{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px;padding:7px 0;position:relative}
.tl-row .tl-l{text-align:right;font-size:12.5px;min-width:0}
.tl-row .tl-r{text-align:left;font-size:12.5px;min-width:0}
.tl-c{display:flex;flex-direction:column;align-items:center;gap:1px;z-index:1}
.tl-ic{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.tl-min{font-size:10px;font-weight:800;color:var(--muted)}
.tl-row.h .tl-ic{border-color:var(--navy)}.tl-row.a .tl-ic{border-color:var(--red)}
.tl .who{font-weight:800;color:var(--navy)}.tl .ass{color:var(--muted);font-size:11px}
.tl-sc{font-weight:900;color:var(--red);font-size:13px;margin-top:1px}
.tl-sub{font-size:12px;line-height:1.35}.tl-sub{color:var(--text)}
.tl-dt{font-size:10.5px;color:var(--muted)}
.tl-ht{text-align:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 0;margin:8px auto;max-width:72%;position:relative;z-index:1}
.tl-info{margin-top:16px}
/* 03 전체/전반/후반 세그먼트 */
.st-seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.st-seg .segb{flex:1;padding:8px 6px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);background:transparent}
.st-seg .segb.on{background:var(--red);color:#fff}
/* #1 홈/원정 배지 */
.ha{display:inline-block;font-size:9.5px;font-weight:800;line-height:1;padding:2px 5px;border-radius:5px;margin-top:3px;letter-spacing:.2px}
.ha.h{background:rgba(20,39,72,.1);color:var(--navy)}
.ha.a{background:rgba(223,18,59,.1);color:var(--red)}
.ha.n{background:var(--soft);color:var(--muted)}
.side .ha,.bm-team .ha{margin-top:2px}
.dt-sc .tcol .ha{margin-top:4px}
.dt-sc .tcol .ha.h{background:rgba(255,255,255,.18);color:#fff}
.dt-sc .tcol .ha.a{background:rgba(255,255,255,.18);color:#fff}
.dt-sc .tcol .ha.n{background:rgba(255,255,255,.14);color:#fff}
.bm-team .ha.h{background:rgba(255,255,255,.18);color:#fff}.bm-team .ha.a{background:rgba(255,255,255,.18);color:#fff}.bm-team .ha.n{background:rgba(255,255,255,.14);color:#fff}
/* #7 경고·퇴장 행 (아이콘·색상 구분·간격) */
.cards-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.cards-row .cc{display:flex;gap:6px;flex:0 0 auto}
.cards-row .cl{color:var(--muted);font-size:12px;text-align:center;flex:1}
.cdc{font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px}
.cdc.y{background:rgba(240,165,0,.14);color:#9a6a00}
.cdc.r{background:rgba(223,18,59,.12);color:var(--red)}
.cdc.z{color:var(--muted)}
/* P01·P02 농구 득점 그래프 */
.bsg-wrap{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin:2px 0 8px}
.bsg-svg{width:100%;height:150px;display:block;touch-action:manipulation;cursor:crosshair}
.bsg-det{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.bsg-nav{display:flex;align-items:center;gap:8px}
.bsg-b{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--navy);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}
.bsg-b:active{background:var(--line)}
.bsg-mid{flex:1;min-width:0;text-align:center}
.bsg-sc{font-size:20px;font-weight:900}
.bsg-meta{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.bsg-tx{font-size:12.5px;margin-top:3px;line-height:1.3;word-break:break-word}
.bsg-lg{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}.bsg-lg .lh{color:var(--navy)}.bsg-lg .la{color:var(--red)}
.gm-sub.fb{flex-direction:column;gap:3px;width:100%;max-width:300px;margin:0 auto}
.fbrow{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;font-weight:800;color:var(--navy)}
.fbrow .fbside{flex:0 0 46px;text-align:left}
.fbrow .fbside.r{text-align:right}
.fbrow .fblbl{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:10.5px}
.cb{display:inline-block;min-width:15px;text-align:center;font-size:10px;font-weight:900;color:#fff;border-radius:3px;padding:0 3px;margin-right:2px}
.cb.y{background:var(--amber)}.cb.r{background:var(--red)}.cb.z{background:var(--soft2);color:var(--muted)}
.fbrow .posbar{flex:1;height:6px;border-radius:4px;background:var(--soft2);display:flex;overflow:hidden}
.fbrow .posbar .ph{background:var(--navy)}.fbrow .posbar .pa{background:var(--red);margin-left:auto}
.bso{display:flex;gap:10px;align-items:center;font-size:11px;font-weight:800;color:var(--navy)}
.bso .b{display:flex;gap:3px;align-items:center}
.bso .d{width:8px;height:8px;border-radius:50%;background:var(--line)}
.bso .d.on{background:var(--amber)}
.bso .d.red.on{background:var(--red)}
.diamond{position:relative;width:26px;height:26px}
.diamond i{position:absolute;width:9px;height:9px;background:var(--line);transform:rotate(45deg)}
.diamond i.on{background:var(--amber)}
.diamond .b1{right:0;top:9px}.diamond .b2{left:9px;top:0}.diamond .b3{left:0;top:9px}
/* 라인스코어 테이블 */
.linescore{grid-column:1/-1;overflow-x:auto;margin-top:2px}
.linescore table{border-collapse:collapse;width:100%;font-size:11.5px}
.linescore th,.linescore td{padding:3px 6px;text-align:center;border:1px solid var(--line);white-space:nowrap}
.linescore th{background:var(--soft);font-weight:800;color:var(--muted)}
.linescore td.tm{text-align:left;font-weight:700}
.linescore td.rr{font-weight:900;color:var(--red)}

/* ===== 상태 메시지 ===== */
.msg{padding:40px 20px;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.msg .big{font-size:34px;margin-bottom:8px}
.delay{margin:0 16px 8px;background:#fff7e6;border:1px solid #ffe3a3;color:#9a6b00;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px}

/* ===== 전체 메뉴 ===== */
.menu-screen{padding:16px 16px 20px}
.menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.menu-top .logo{font-size:20px}
.menu-title{font-size:26px;font-weight:900;margin:4px 0 16px}
.acct{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:14px 15px;margin-bottom:22px}
.acct .av{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;flex:0 0 auto}
.acct .tx{flex:1;min-width:0}
.acct .tx b{font-size:14.5px}.acct .tx span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.acct .go{background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:9px 16px;border-radius:10px;white-space:nowrap}
.m-group{margin-bottom:22px}
.m-label{font-size:12.5px;font-weight:800;color:var(--muted);margin:0 2px 10px}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-cell{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 14px;font-weight:800;font-size:14.5px}
.m-cell .mi{font-size:19px;display:inline-flex;align-items:center;justify-content:center;color:var(--navy)}
.mic{width:22px;height:22px;display:block}
.m-cell .mic{width:23px;height:23px}
.m-row .mi{color:var(--navy);display:inline-flex;align-items:center;justify-content:center}
.m-list .m-row{display:flex;align-items:center;gap:11px;padding:14px 4px;min-height:48px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
.m-list .m-row:active{background:var(--soft)}
.m-list .m-row>*{pointer-events:none}   /* 자식(아이콘·텍스트·›)이 터치를 가로채 '첫 터치 무시'되던 문제 해결 → 칸 전체가 하나의 클릭 영역 */
.m-list .m-row:last-child{border-bottom:none}
.m-row .mi{font-size:18px;width:22px;text-align:center}
.m-row .rv{margin-left:auto;color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.m-row .chev{margin-left:auto;color:#c9d0db;font-size:18px}
.m-row .rv+.chev{margin-left:8px}
.menu-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.menu-foot b{color:var(--navy);font-weight:900}

/* ===== 하단 고정 메뉴 ===== */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  display:flex;max-width:var(--maxw);margin:0 auto;padding-bottom:var(--safe-b)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:700}
.bn svg{width:23px;height:23px}
.bn.on{color:var(--red)}
.bn.menu{background:var(--soft)}
.bn.menu.on{background:var(--soft)}

/* 예시데이터 리본 */
.demo{margin:10px 16px 0;background:#eef4ff;border:1px dashed #b8ccf5;color:#2b5bb5;font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;text-align:center}

/* ===== 상세 화면(오버레이) ===== */
.detail{position:fixed;inset:0;z-index:50;background:#fff;max-width:var(--maxw);margin:0 auto;overflow-y:auto;padding-bottom:calc(20px + var(--safe-b))}
.dt-bar{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dt-bar .bk{font-size:22px;color:var(--navy);width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.dt-bar .ti{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-head{padding:18px 16px;background:linear-gradient(135deg,#15284d,#223a63);color:#fff}
.dt-lg{text-align:center;font-size:12.5px;font-weight:700;opacity:.9;margin-bottom:12px;display:flex;gap:6px;align-items:center;justify-content:center}
.dt-sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.dt-sc .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.dt-sc .tcol img,.dt-sc .tcol .ph{width:52px;height:52px;object-fit:contain}
.dt-sc .tcol .ph{display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.12);border-radius:50%}
.dt-sc .tcol .nm{font-weight:800;font-size:14px;text-align:center}
.dt-sc .mid .big{font-size:30px;font-weight:900}
.dt-sc .mid .big.t{font-size:24px}
.dt-sc .mid .stt{margin-top:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);display:inline-block}
.dt-sc .mid .stt.live{background:var(--green)}
.dt-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:59px;background:#fff;z-index:4;scrollbar-width:none}
.dt-tabs::-webkit-scrollbar{display:none}
.dt-tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);background:var(--soft)}
.dt-tab.on{background:var(--navy);color:#fff}
.dt-body{padding:14px 16px}
.dt-sec-t{font-weight:900;font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.dt-sec-t:first-child{margin-top:0}
/* 라인업 피치 */
.pitch{background:linear-gradient(#1f8a4c,#176b3b);border-radius:14px;padding:18px 6px;position:relative;margin:6px 0;overflow:hidden}
.pitch::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.18)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:66px;height:66px;border:2px solid rgba(255,255,255,.18);border-radius:50%;transform:translate(-50%,-50%)}
.lu-tg{display:flex;gap:6px;margin:2px 0 10px}
.lu-tb{flex:1;padding:8px 6px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);background:var(--soft);border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu-tb.on{background:var(--red);color:#fff;border-color:var(--red)}
.lu-form{font-size:13px;color:var(--navy);margin:2px 0 2px}.lu-form b{background:var(--soft);border-radius:6px;padding:2px 8px;margin-right:6px;color:var(--muted);font-size:11.5px}
.lu-coach{font-size:12.5px;color:var(--navy);margin:10px 0 2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.lu-coach span{color:var(--muted);font-weight:800;margin-right:6px}
.lu-ref{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.3);border-radius:10px;padding:8px 12px;margin:2px 0 8px;font-size:12px;font-weight:800;color:#9a6a00}
.lu-ref span{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:2px}
.pitch .rowf{display:flex;justify-content:space-around;margin:14px 0}
.pl{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px}
.pl .no{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.1)}
.pl .pn{font-size:10px;color:#fff;font-weight:700;text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.formrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}
.subs{display:flex;flex-wrap:wrap;gap:6px}
.subchip{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-weight:700}
/* 이벤트 타임라인 */
.evt{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.evt .min{font-weight:900;color:var(--navy);width:40px;flex:0 0 auto}
.evt .ic{font-size:16px;width:22px;text-align:center}
.evt .who{font-weight:700}
.evt .ass{color:var(--muted);font-size:12px}
.evt.away{flex-direction:row-reverse;text-align:right}
/* 스탯 바 */
.stbar{margin:10px 0}
.stbar .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:4px}
.stbar .tr{height:7px;border-radius:4px;background:var(--soft2);display:flex;overflow:hidden}
.stbar .tr .h{background:var(--navy)}.stbar .tr .a{background:var(--red);margin-left:auto}
.stbar .lab .stw{position:relative;color:var(--navy);font-weight:900}.stbar .lab .stw::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#1aa65a;margin-left:4px;vertical-align:middle}
html[data-theme="dark"] .stbar .lab .stw{color:#9cc2ff}
.flw-filt{display:flex;gap:6px;margin:10px 0}
.fchip{border:1px solid var(--line);background:var(--card,#fff);color:var(--muted);border-radius:16px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrp{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.qhd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;background:var(--soft)}
.qhd .ql{font-weight:900;font-size:13.5px}
.qhd .qd{font-size:12px;color:var(--muted)}
.qhd .qc{margin-left:auto;font-size:11.5px;color:#8a93a3}
.qhd .qchev{transition:transform .15s;color:#8a93a3;font-size:12px}
.qgrp.open .qhd .qchev{transform:rotate(180deg)}
.qbody{display:none;padding:4px 10px 8px}
.qgrp.open .qbody{display:block}
.fe.sc{background:rgba(20,39,72,.04);border-radius:6px}
.fe .fpl{font-weight:900;color:#1aa65a;margin:0 4px}
html[data-theme="dark"] .fe.sc{background:rgba(156,194,255,.08)}
.bcourt{position:relative;width:100%;aspect-ratio:1.9/1;background:linear-gradient(#e7eef7,#dde7f4);border:1px solid var(--line);border-radius:10px;margin:6px 0 2px;overflow:hidden}
.bcourt::before{content:"";position:absolute;left:50%;top:8%;bottom:8%;width:2px;background:rgba(20,39,72,.18)}
.bcourt::after{content:"";position:absolute;left:calc(50% - 26px);top:calc(50% - 26px);width:52px;height:52px;border:2px solid rgba(20,39,72,.18);border-radius:50%}
.cpl{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:62px}
.cpl .cno{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:12px}
.cpl.h .cno{background:var(--navy)}.cpl.a .cno{background:var(--red)}
.cpl .cnm{display:block;font-size:10.5px;font-weight:700;margin-top:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpl .cpt{display:block;font-size:9.5px;color:#64707f}
html[data-theme="dark"] .bcourt{background:linear-gradient(#1b2740,#141f33);border-color:#2c3a54}
html[data-theme="dark"] .cpl .cpt{color:#9aa6b6}
/* 순위표 */
.rank{width:100%;border-collapse:collapse;font-size:12.5px}
.rank th,.rank td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.rank th{background:var(--soft);font-weight:800;color:var(--muted);font-size:11.5px}
.rank td.tm{text-align:left;font-weight:700}
.rank td.rk{font-weight:900;color:var(--navy)}
.rank.bsk td{vertical-align:top}
.bsx{color:var(--muted);font-size:10px;font-weight:600;margin-top:2px;line-height:1.3}
.foulq{font-size:11px;font-weight:800;color:var(--red);background:#fff1f1;border:1px solid #ffd7d7;border-radius:6px;padding:2px 8px}
.rank.bsk .bskrow{cursor:pointer}
.rank.bsk .plink{color:var(--navy);font-weight:700;border-bottom:1px dotted var(--line)}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pst{background:var(--soft);border-radius:10px;padding:9px 4px;text-align:center}
.pst .v{display:block;font-size:17px;font-weight:900;color:var(--navy)}
.pst .l{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
/* 인사이트(명령서 6) */
.iz-wrap-ovf,.sv-wrap{overflow-x:hidden}
.iz-head h2{margin:0;font-size:22px;color:var(--navy);font-weight:900}
.iz-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.iz-sel{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.iz-sel::-webkit-scrollbar{display:none}
.iz-sel select{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--navy);max-width:60vw}
.iz-sh{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14.5px;color:var(--navy);margin:16px 0 8px}
.iz-sh::before{content:"";width:4px;height:15px;background:var(--red);border-radius:2px}
.iz-sh .rt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.iz-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.iz-stat .c{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px 8px;min-height:60px;box-sizing:border-box}
.iz-stat .c .k{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iz-stat .c .n{font-size:24px;font-weight:900;margin-top:4px;color:var(--red)}
.iz-note{font-size:13px;color:var(--muted);padding:12px 2px}
.iz-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.iz-card .top{background:var(--soft);padding:9px 14px;font-size:12.5px;font-weight:800;color:var(--navy)}
.iz-card .vs{display:flex;align-items:center;justify-content:space-between;padding:16px 14px;gap:8px}
.iz-card .tm{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:0}
.iz-card .tm img{width:34px;height:34px;object-fit:contain}
.iz-card .tm .nm{font-weight:900;font-size:14.5px;color:var(--navy);text-align:center;line-height:1.2;word-break:keep-all}
.iz-card .vsx{font-weight:800;color:var(--muted);font-size:13px;flex:0 0 auto}
.iz-form{padding:4px 14px 2px}
.iz-form .lb{font-weight:800;font-size:13px;color:var(--navy);margin-bottom:7px}
.iz-form .rows{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iz-chip{display:inline-flex;width:24px;height:24px;border-radius:7px;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center}
.iz-metric{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.iz-metric .mid{font-size:12.5px;color:var(--muted);font-weight:700}
.iz-metric .sd{font-size:16px;font-weight:900;color:var(--navy);min-width:48px;text-align:center}
.iz-verdict{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.iz-verdict .vt{font-weight:800;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:7px}
.iz-verdict .vt::before{content:"";width:3px;height:14px;background:var(--red);border-radius:2px}
.iz-verdict .go{font-size:12.5px;color:var(--navy);font-weight:800;white-space:nowrap}
.iz-foot{font-size:11px;color:var(--muted);text-align:center;padding:10px 4px 2px}
.iz-lg{display:flex;align-items:center;gap:10px;padding:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer}
.iz-lg img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.iz-lg .nm{font-weight:800;font-size:14px;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iz-lg .rt{font-size:12px;color:var(--muted);white-space:nowrap}
.iz-lg .chev{color:var(--muted)}
/* 설정·알림 화면 공통 */
.setgrp{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:10px 0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lb{font-weight:800;font-size:14px;color:var(--navy)}
.setrow .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.setrow .rv{color:var(--red);font-weight:800;font-size:13px}
.sw{width:50px;height:28px;border-radius:999px;background:var(--soft2);position:relative;flex:0 0 auto;transition:background .15s;cursor:pointer}
.sw::before{content:"";position:absolute;top:-9px;bottom:-9px;left:-9px;right:-9px}/* R020: 스위치 탭 영역 ≥44px */
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--navy)}.sw.on i{left:25px}
.seg{display:flex;gap:7px;margin:4px 0 12px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;color:var(--navy)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sect-h{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;color:var(--navy);margin:18px 0 6px}
.sect-h::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px}
.permbar{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;font-weight:800;font-size:13.5px}
.ibrow{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ibrow.unread{background:rgba(228,0,43,.04)}
.ibrow .ibt{font-weight:800;font-size:13.5px;color:var(--navy)}
.ibrow.unread .ibt::before{content:"●";color:var(--red);font-size:9px;margin-right:6px;vertical-align:middle}
.ibrow .ibb{font-size:12.5px;color:var(--navy2);margin-top:3px}
.ibrow .ibd{font-size:11px;color:var(--muted);margin-top:3px}
.news-item .nwimg{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-bottom:6px}
#btnBell{position:relative}
#btnBell .bdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)}
.perm-ok{color:var(--green)}.perm-no{color:var(--red)}
.rosterw{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:4px 0 12px}
.rosterp{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 2px;border-bottom:1px solid var(--line)}
.rosterp .no{min-width:22px;text-align:center;font-weight:800;color:var(--muted);font-size:11px;background:var(--soft);border-radius:5px;padding:1px 0}
.rosterp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow{display:flex;flex-direction:column;gap:2px}
.fe{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px}
.fe.h{background:#f3f7ff}.fe.a{background:#fff5f3}
.fe .fcl{flex:0 0 42px;color:var(--muted);font-size:11px;font-weight:700}
.fe .ftx{flex:1;line-height:1.3}
.fe .fsc{flex:0 0 auto;font-weight:900;color:var(--navy)}
/* 뉴스 */
.news-item{display:block;padding:12px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.news-item .nt{font-weight:800;font-size:14px}.news-item .nm2{font-size:12px;color:var(--muted);margin-top:3px}
/* 채팅 */
.chatbox{display:flex;flex-direction:column;height:60vh}
.chatlog{flex:1;overflow-y:auto;padding:8px 2px}
.cmsg{margin:5px 0;font-size:13.5px}.cmsg .cn{font-weight:800;color:var(--navy);margin-right:6px}
.cmsg.sys{color:var(--muted);font-size:12px;text-align:center}
.chatin{display:flex;gap:8px;padding:8px 0}
.chatin input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.chatin button{background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:0 16px}
/* 로그인 */
.loginbox{padding:30px 20px;text-align:center}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px;background:#fff;margin-top:14px}

@media(min-width:560px){
  .bm-team img,.bm-team .ph{width:74px;height:74px}
  .m-grid{gap:12px}
}
</style>

  function statusText(g){

  function periodColLabel(sport,i,isHalves){

    if(sport==="volleyball")return (i+1)+"S";

  function liveClockStr(sec,upd,run){
    sec=+sec||0;
    if(run&&upd){ var elapsed=Math.floor(Date.now()/1000)-(+upd); sec=sec-elapsed; }
    if(sec<0)sec=0;
    var m=Math.floor(sec/60), s=Math.floor(sec%60);
    return m+":"+(s<10?"0":"")+s;
  }
  // ⚽ 축구 경기시계(#6): 하프 킥오프 기준시각(ts)부터 위로 흐르는 MM:SS. base=하프 시작까지 누적초(1H=0,2H=2700…).
  //   run=0(하프타임·중단 등)이면 멈춤. cap으로 수신지연 시 무한 증가 방지(하프 길이+여유에서 고정).
  function fbClockStr(base,ts,run,cap){
    base=+base||0; var sec=base;
    if(run&&ts){ sec = base + Math.max(0, Math.floor(Date.now()/1000)-(+ts)); }
    if(cap&&sec>+cap) sec=+cap;
    if(sec<0)sec=0;
    var m=Math.floor(sec/60), s=Math.floor(sec%60);
    return m+":"+(s<10?"0":"")+s;
  }
  // 1초마다 화면의 라이브 시계(.lc 농구/하키 카운트다운, .fc 축구 카운트업)만 갱신 (전체 리렌더 없이)
  setInterval(function(){
    document.querySelectorAll(".lc").forEach(function(e){ try{ e.textContent=liveClockStr(e.getAttribute("data-s"),e.getAttribute("data-u"),e.getAttribute("data-r")==="1"); }catch(_){}} );
    document.querySelectorAll(".fc").forEach(function(e){ try{ e.textContent=fbClockStr(e.getAttribute("data-b"),e.getAttribute("data-ts"),e.getAttribute("data-r")==="1",e.getAttribute("data-cap")); }catch(_){}} );
  },1000);

  function recvText(){

    if(sec<60){ var s=({en:sec+"s ago",ko:sec+"초 전",ja:sec+"秒前",zh:sec+"秒前",es:"hace "+sec+"s",hi:sec+" से पहले",vi:sec+"s trước",th:sec+" วิ",ru:sec+" с назад",de:"vor "+sec+"s",fr:"il y a "+sec+"s",it:sec+"s fa"})[LANG]||(sec+"s ago"); return rec+" · "+s; }
    var m=Math.round(sec/60); var sm=({en:m+"m ago",ko:m+"분 전",ja:m+"分前",zh:m+"分钟前",es:"hace "+m+"m",hi:m+" मिनट पहले",vi:m+"ph trước",th:m+" นาที",ru:m+" мин назад",de:"vor "+m+"m",fr:"il y a "+m+"m",it:m+"m fa"})[LANG]||(m+"m ago");

  // 오래된 '진행 중' 의심 경기: live 인데 0:0 이고 시작시각이 4시간+ 지났으면 데이터 갱신 지연 의심
  // (숨기지 않음 · 가짜 상태 주입 안 함. 빅매치/대표 노출에서만 제외하고 '정보 확인 중'으로 표기)
  function isStaleLive(g){
    if(stateOf(g)!=="live")return false;
    var z=(g.hs==null||g.hs===0)&&(g.as==null||g.as===0);
    if(!z)return false;
    var allZero=!g.setScores||g.setScores.every(function(p){return (p.home==null||p.home===0)&&(p.away==null||p.away===0)});
    if(!allZero)return false;
    if(!g.date)return false;
    var age=Date.now()-new Date(g.date).getTime();
    return age>4*3600*1000;
  }

    var arr=LEAGUES[sport]||[]; var s=String(name||""); var c=String(country||"");
    if(SUBTIER_RE.test(s)) return 950;                                  // 하위/유소년/리저브 → 기타보다도 뒤
    // 이름 매칭 우선. 국가(co)는 '값이 있을 때만' 모순 검사(공급사가 country를 비우면 이름만으로 인정).
    for(var i=0;i<arr.length;i++){ var d=arr[i]; if(d.re.test(s)){ if(d.x&&d.x.test(s)) continue; if(d.co&&c&&!d.co.test(c)) continue; return i; } }

  function isBigLeague(sport,name,country){ return leagueRank(sport,name,country)<900; }
  var BIG_STAGE_RE=/final|결승|준결승|semi[-\s]?final|playoff|플레이오프|포스트시즌|post[-\s]?season|grand\s*final|championship|clasico|더비|derby|el\s*clasico/i;
  // 상단 메인경기(#9/#15): 빅리그 안에서만. 진행 경기 → 예정 경기 → 종료 순. 결승·PO 우선. 리그 우선순위는 그 다음.

  function pickBig(games){
    if(!games||!games.length) return null;
    var sp=S.sport, now=Date.now(), cand=[];
    games.forEach(function(g){
      var r=leagueRank(sp,g.league,g.country); if(r>=900) return;       // 빅리그 아니면 제외
      var st=stateOf(g); if(st==="live"&&isStaleLive(g)) return;        // 오래된 0:0 의심 라이브 제외
      // #2 종료 경기는 '잠시만' 후보 — 킥오프 3.5시간(경기+여유) 지난 종료 빅매치는 상단에서 제외(오래된 결과 잔존 방지)
      if(st==="finished"){ var kt=g.date?new Date(g.date).getTime():0; if(!kt||(now-kt)>3.5*3600*1000) return; }
      var stRank = st==="live"?0 : (st==="scheduled"?1:2);              // 진행0 < 예정1 < 종료2
      var stage = BIG_STAGE_RE.test(String(g.league||"")+" "+String(g.round||g.stage||""))?1:0;
      cand.push({g:g,r:r,stRank:stRank,stage:stage,dt:g.date?new Date(g.date).getTime():0});
    });
    if(cand.length){
      cand.sort(function(a,b){
        if(a.stRank!==b.stRank) return a.stRank-b.stRank;               // 진행 → 예정 → 종료
        if(b.stage!==a.stage) return b.stage-a.stage;                   // 결승·PO 우선
        if(a.r!==b.r) return a.r-b.r;                                   // 리그 우선순위
        if(a.stRank===1) return (a.dt||1e15)-(b.dt||1e15);              // 예정은 임박순
        return (b.dt||0)-(a.dt||0);                                     // 진행/종료는 최신순
      });
      return cand[0].g;
    }
    // 🔶 폴백: 빅리그 후보가 없어도 '경기가 있으면 무조건' 그나마 제일 나은 경기를 배너로 노출.
    //    우선순위: 정상 라이브 > 예정 > (오래된 0:0 의심) 라이브 > 종료. 같은 등급이면 리그 랭크 → 라이브·종료는 최신, 예정은 임박순.

    });

      if(a.stRank!==b.stRank) return a.stRank-b.stRank;

      if(a.stRank===1) return (a.dt||1e15)-(b.dt||1e15);

    else {

  function agFillLeague(bd,lk){
    var k=_ag.sport+"|"+_ag.date; var d=S.data[k]; if(!d||!d.games)return;

    var q=_ag.q.trim().toLowerCase();
    var games=d.games.filter(function(g){ return (g.league||"")===lk || ((g.country?g.country+" · ":"")+(g.league||""))===lk; });
    // groupByLeague의 키는 'country · league' 형태일 수 있으므로 양쪽 매칭
    if(!games.length) games=d.games.filter(function(g){ return (g.league||"")===lk; });
    if(q) games=games.filter(function(g){ return ((g.home||"")+" "+(g.away||"")+" "+(g.league||"")+" "+(g.country||"")).toLowerCase().indexOf(q)>=0; });
    if(_ag.status==="live") games=games.filter(function(g){ return stateOf(g)==="live"; });
    // 상태 정렬: 진행 → 예정(임박순) → 종료
    games.sort(function(a,b){ var ra=agStRank(a),rb=agStRank(b); if(ra!==rb)return ra-rb; return (a.date||"")<(b.date||"")?-1:1; });
    games.forEach(function(g){ bd.appendChild(gameCard(g)); });
  }
  function agStRank(g){ var s=stateOf(g); return s==="live"?0:(s==="scheduled"?1:2); }
  function agShiftDate(ds,delta){ try{ var p=ds.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+delta); var mm=("0"+(d.getMonth()+1)).slice(-2),dd=("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+mm+"-"+dd; }catch(e){ return ds; } }

  // ====== 리그 블록 ======
  function groupByLeague(list){
    var m={},order=[];
    list.forEach(function(g){ var k=(g.country?g.country+" · ":"")+(g.league||tl({en:"Other",ko:"기타",ja:"その他",zh:"其他",es:"Otros",hi:"अन्य",vi:"Khác",th:"อื่นๆ",ru:"Другое",de:"Sonstige",fr:"Autres",it:"Altro"})); if(!m[k]){m[k]={name:k,logo:g.leagueLogo,games:[],lg:g.league,co:g.country};order.push(k);} m[k].games.push(g); });
    var groups=order.map(function(k){return m[k]});
    // #8: 빅리그 우선 정렬(버튼과 동일 규칙). 같은 순위면 경기수↓·이름순 → 갱신마다 순서 고정(마이너가 앞에 안 옴).
    groups.sort(function(a,b){
      var ra=leagueRank(S.sport,a.lg,a.co),rb=leagueRank(S.sport,b.lg,b.co);
      if(ra!==rb)return ra-rb;
      if(b.games.length!==a.games.length)return b.games.length-a.games.length;
      return a.name<b.name?-1:(a.name>b.name?1:0);
    });
    return groups;
  }
  // 상단 고정(sticky/fixed) 헤더 스택의 실제 높이 — 고정 리그가 그 뒤에 가려지지 않도록 계산

    return b||110;

  function colKey(name){ return S.sport+"|"+name; }   // 접힘 상태는 종목+리그로 분리 관리(다른 종목과 안 섞임)
  function leagueBlock(grp,pinned){

    if(g.tsid) return String(g.tsid);
    if(/^[a-z0-9]{10,}$/i.test(id)) return id;   // 접두어 없는 더스포츠 id(야구 등). 순수 숫자(API-Sports)는 제외

  }

      var html='<div style="font-size:11.5px;color:var(--muted);margin-bottom:6px">'+esc(g.league||"")+seasonTag+'</div>'+warn+rankTableHtml(sport,rows,[g.home,g.away])+

  // F01/F02: 축구 경기 흐름 그래프 — API-Football 이벤트(득점·카드·교체의 실제 분)로 득점 진행 타임라인.
  //  시간대별 모멘텀 파형은 공급사 미제공이라 생성하지 않음(명령서 F02). 데이터 없으면 '미제공' 명시.
  function loadFootballFlow(g){
    var box=$("#ovFlow"); if(!box)return;
    if(!g.apiFixture){ box.innerHTML=''; return; }   // fixmap 해석 전/실패 → 개요의 다른 실데이터는 그대로
    var tk=_dtTok;
    fetch("/api/asports/events?fixture="+encodeURIComponent(g.apiFixture)).then(function(r){return r.json();}).then(function(j){
      if(tk!==_dtTok)return; var bx=$("#ovFlow"); if(!bx)return;
      var evs=(j&&j.events)||[];
      var title='<div class="dt-sec-t">📈 '+t("matchFlow")+'</div>';
      if(!evs.length){ bx.innerHTML=title+'<p style="color:#8a93a3;font-size:12.5px">'+t("flowNoData")+'</p>'; return; }
      var homeId=g.homeId;
      var mn=function(e){ return (+e.minute||0)+(+e.extra||0); };
      var isHomeEv=function(e){ var h=String(e.teamId)===String(homeId); if(/own\s*goal/i.test(e.detail||""))h=!h; return h; };
      var maxMin=90; evs.forEach(function(e){ if(mn(e)>maxMin)maxMin=mn(e); }); maxMin=Math.max(maxMin,90);
      // 득점 진행(계단)
      var goals=evs.filter(function(e){ return /goal/i.test(e.type)&&!/missed|cancelled|penalty\s*(miss|saved)/i.test((e.detail||"")+(e.type||"")); }).sort(function(a,b){return mn(a)-mn(b);});
      var W=320,Hh=108,PL=8,PR=8,PT=16,PB=16,iw=W-PL-PR,ih=Hh-PT-PB,cy=PT+ih/2;
      var X=function(m){ return PL+Math.min(1,m/maxMin)*iw; };
      var hs=0,as=0,pts=[{x:PL,hs:0,as:0}];
      goals.forEach(function(e){ if(isHomeEv(e))hs++; else as++; pts.push({x:X(mn(e)),hs:hs,as:as,home:isHomeEv(e),e:e}); });
      // 계단 경로(홈=위로 +, 원정=아래로 −) : 득점차 d = hs-as
      var mx=Math.max(1,hs,as);
      var yFor=function(d){ return cy - (d/mx)*(ih/2); };
      var d='M'+PL+' '+cy; var cd=0;
      pts.forEach(function(p,i){ if(i===0)return; var pd=p.hs-p.as; d+=' L'+p.x+' '+yFor(cd)+' L'+p.x+' '+yFor(pd); cd=pd; });
      d+=' L'+(W-PR)+' '+yFor(cd);
      // HT 선(45분)
      var htx=X(45);
      // 득점 마커
      var gm=pts.slice(1).map(function(p){ return '<circle cx="'+p.x+'" cy="'+(p.home?PT+6:Hh-PB-6)+'" r="4" fill="'+(p.home?"var(--navy)":"var(--red)")+'"/><text x="'+p.x+'" y="'+(p.home?PT+2:Hh-PB+2)+'" font-size="8" text-anchor="middle" fill="#8a93a3">'+p.hs+'-'+p.as+'</text>'; }).join("");

  function pitchHtml(xi){

    else { var per=[1,4,3,3]; var i=0; [0,1,2,3].forEach(function(ri){ rows[ri+1]=xi.slice(i,i+per[ri]); i+=per[ri]; }); if(i<xi.length)(rows[4]=rows[4]||[]).push.apply(rows[4],xi.slice(i)); }

  // 축구 이벤트 — TheSports(계약 메인) 1순위. 비면 API-Football(평점·사건이후점수 풍부)로 보완.
  function loadFootballEvents(g,forceApi){

      fetch("/api/football/live?id="+encodeURIComponent(g.id)).then(function(r){return r.json()}).then(function(j){

        var h='<div class="flow">'+ev.map(function(e){ var who=e.team===1?"h":(e.team===2?"a":""); return '<div class="fe '+who+'"><span class="fcl">'+esc(e.minute?(e.minute+"'"):"")+'</span><span class="ftx">'+esc(e.text||"")+'</span></div>'; }).join("")+'</div>';

    }
    fetch("/api/asports/events?fixture="+encodeURIComponent(g.apiFixture||g.id)).then(function(r){ if(!r.ok)throw 0; return r.json()}).then(function(j){
      if(!dtFresh(tk))return;
      if(j&&j.error) throw 0;
      var ev=(j&&j.events)||[];
      if(!ev.length){ var m=stateOf(g)==="scheduled"?t("eventsAfterStart"):t("noEventsLive"); dtBody('<div class="msg"><div class="big">⚽</div>'+m+'</div>'); return; }
      // 시간순으로 득점 누계 계산(사건 이후 점수 표시). 취소·무효 골은 제외, 자책골은 상대 득점.
      var seq=ev.slice().sort(function(a,b){ return ((a.minute||0)+(a.extra||0)/100)-((b.minute||0)+(b.extra||0)/100); });
      var hs=0,as=0;

        var isHome=e.team===g.home;

        var isGoal=e.type==="Goal";

        e._hs=hs; e._as=as; e._isGoal=isGoal&&!cancelled;
        e._kind=isGoal?"goal":(e.type==="Card"?"card":((e.type==="subst"||e.type==="Subst")?"sub":"etc"));
      });
      // 02 중앙 타임라인 — 필터(전체/골/카드/교체) + 홈/원정 좌우 배치 + 전반종료 구분 + 경기정보.
      var evFilter="all";
      function emoOf(e){ return e._kind==="goal"?(/own/i.test(e.detail)?"⚽":"⚽"):(e._kind==="card"?(/red/i.test(e.detail)?"🟥":"🟨"):(e._kind==="sub"?"🔄":(/var/i.test(e.type)?"📺":"•"))); }
      function evInner(e){

        var sub=e._kind==="sub"?('<div class="tl-sub">▲ '+esc(e.player||"")+(e.assist?'<br>▼ '+esc(e.assist):'')+'</div>'):(plink+(e.assist?' <span class="ass">('+esc(e.assist)+')</span>':''));
        var detailTxt=(e.detail&&!/normal goal/i.test(e.detail)&&e._kind!=="sub")?'<div class="tl-dt">'+esc(e.detail)+'</div>':'';
        var scoreTag=e._isGoal?'<div class="tl-sc">'+e._hs+' – '+e._as+'</div>':'';
        return sub+detailTxt+scoreTag;
      }
      function renderTl(){
        var box=$("#tlBody"); if(!box)return;

        var h='', htShown=false;

        var rev=list.slice().reverse();
        rev.forEach(function(e,i){

          var minTxt=(e.minute!=null?e.minute+(e.extra?"+"+e.extra:""):"")+"'";
          // 이 이벤트가 후반(>45)이고 다음(아래) 이벤트가 전반이면 그 사이에 '전반 종료' 삽입
          var cur=e.minute||0, nxt=(rev[i+1]&&rev[i+1].minute)||0;
          h+='<div class="tl-row '+(isHome?"h":"a")+'"><div class="tl-l">'+(isHome?evInner(e):'')+'</div><div class="tl-c"><span class="tl-ic">'+emoOf(e)+'</span><span class="tl-min">'+minTxt+'</span></div><div class="tl-r">'+(isHome?'':evInner(e))+'</div></div>';
          if(!htShown && cur>45 && nxt<=45 && nxt>0){ h+='<div class="tl-ht">'+t("htEnd")+'</div>'; htShown=true; }
        });
        box.innerHTML='<div class="tl">'+h+'</div>';
        box.querySelectorAll(".pl-c").forEach(function(elp){ elp.onclick=function(){ var pid=elp.dataset.pid,pnm=elp.dataset.pnm; if(pid)openPlayer("football",pid,pnm); }; });
      }
      var chips=[["all",t("all")],["goal","⚽ "+tl({en:"Goals",ko:"골",ja:"ゴール",zh:"进球",es:"Goles",hi:"गोल",vi:"Bàn",th:"ประตู",ru:"Голы",de:"Tore",fr:"Buts",it:"Gol"})],["card","🟨 "+tl({en:"Cards",ko:"카드",ja:"カード",zh:"卡牌",es:"Tarjetas",hi:"कार्ड",vi:"Thẻ",th:"ใบ",ru:"Карты",de:"Karten",fr:"Cartons",it:"Cartellini"})],["sub","🔄 "+tl({en:"Subs",ko:"교체",ja:"交代",zh:"换人",es:"Cambios",hi:"बदलाव",vi:"Thay",th:"เปลี่ยน",ru:"Замены",de:"Wechsel",fr:"Changts",it:"Cambi"})]];
      var info='<div class="tl-info"><div class="sv-sh" style="justify-content:flex-start">'+t("matchInfo")+'</div><div class="sv-card">'+
        '<div class="sv-row"><div class="sl">🏆 '+tl({en:"Competition",ko:"대회",ja:"大会",zh:"赛事",es:"Competición",hi:"प्रतियोगिता",vi:"Giải",th:"รายการ",ru:"Турнир",de:"Wettbewerb",fr:"Compétition",it:"Competizione"})+'</div><div class="sr">'+esc(g.league||"-")+'</div></div>'+
        '<div class="sv-row"><div class="sl">📅 '+tl({en:"Date",ko:"일시",ja:"日時",zh:"日期",es:"Fecha",hi:"तारीख़",vi:"Ngày",th:"วันที่",ru:"Дата",de:"Datum",fr:"Date",it:"Data"})+'</div><div class="sr">'+esc(dateLabel(S.date))+(g.date?' '+hhmm(g.date):'')+'</div></div>'+
        '</div></div>';
      dtBody('<div class="tl-chips" id="tlChips">'+chips.map(function(c){return '<button class="fchip'+(c[0]==="all"?" on":"")+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join("")+'</div><div id="tlBody"></div>'+info);

    }).catch(function(){ dtBody('<div class="msg"><div class="big">⚠️</div>'+t("m_evFail")+'</div>'); });
  }
  // 축구 기록(스탯)
  function loadFootballStats(g){
    dtLoading(); var tk=_dtTok;
    fetch("/api/asports/fbstats?fixture="+encodeURIComponent(g.apiFixture||g.id)).then(function(r){return r.json()}).then(function(j){
      if(!dtFresh(tk))return;
      var tms=(j&&j.teams)||[];

      var hm=tms[0].stats||[], aw=tms[1].stats||[];

      var bars='', shown=0;
      hm.forEach(function(s,i){
        var hvRaw=s.value, avRaw=(aw[i]&&aw[i].value);

        var hv=(hvRaw==null||hvRaw==="")?null:hvRaw, av=(avRaw==null||avRaw==="")?null:avRaw;

        bars+='<div class="stbar"><div class="lab"><span>'+esc(hv==null?"-":String(hv))+'</span><span style="color:#8a93a3">'+esc(statLabel(s.type))+'</span><span>'+esc(av==null?"-":String(av))+'</span></div><div class="tr"><div class="h" style="width:'+(hn/tot*100)+'%"></div><div class="a" style="width:'+(an/tot*100)+'%"></div></div></div>';

      // 03 — 전체/전반/후반 전환. 공급사(API-Football)는 경기 전체값만 제공 → 전/후반은 복제하지 않고 사유 표시.

      var segs=[["all",t("all")],["fh",t("fh")],["sh",t("sh")]];
      dtBody('<div class="st-seg" id="stSeg">'+segs.map(function(s){return '<button class="segb'+(s[0]==="all"?" on":"")+'" data-s="'+s[0]+'">'+s[1]+'</button>';}).join("")+'</div><div id="stBody"></div>');
      renderSt();
      $("#stSeg").querySelectorAll(".segb").forEach(function(b){ b.onclick=function(){ stSeg=b.dataset.s; $("#stSeg").querySelectorAll(".segb").forEach(function(x){x.classList.toggle("on",x===b);}); renderSt(); }; });
    }).catch(function(){ dtBody('<div class="msg"><div class="big">⚠️</div>'+t("loadFailRetry")+'</div>'); });

  function loadBskShotChart(g){
    var el=$("#dtShot"); if(!el||!/^ts/.test(String(g.id||"")))return;
    var tk=_dtTok;
    fetch("/api/basketball/shotchart?id="+encodeURIComponent(g.id)).then(function(r){return r.json()}).then(function(d){
      if(tk!==_dtTok||!$("#dtShot"))return;
      var shots=(d&&d.shots)||[]; if(!shots.length){ el.innerHTML=''; return; }
      var xs=shots.map(function(s){return s.x}), ys=shots.map(function(s){return s.y});
      var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
      var W=320,H=200,pad=10;
      // 좌표는 팀별 자기 공격 반코트 기준(x=바스켓 거리) → 홈=왼쪽 반, 원정=오른쪽 반(미러)으로 배치
      var half=(W-2*pad)/2;
      function nx(x){ return (xmax>xmin?(x-xmin)/(xmax-xmin):0.5); }      // 0(바스켓 근처)~1(하프)
      function py(y){ return pad+(ymax>ymin?(y-ymin)/(ymax-ymin):0.5)*(H-2*pad); }
      function cxOf(s){ var n=nx(s.x); return s.team==='home' ? (pad+n*half) : (W-pad-n*half); }
      var _q='all';
      function draw(){
        var fs=shots.filter(function(s){return _q==='all'||s.period===+_q;});
        var dots=fs.map(function(s){ var cx=cxOf(s),cy=py(s.y),col=s.team==='home'?'#1b57c4':'#d23b3b';
          return s.made?('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.4" fill="'+col+'" fill-opacity="0.9"/>')
            :('<g stroke="'+col+'" stroke-width="1.7"><line x1="'+(cx-3.2).toFixed(1)+'" y1="'+(cy-3.2).toFixed(1)+'" x2="'+(cx+3.2).toFixed(1)+'" y2="'+(cy+3.2).toFixed(1)+'"/><line x1="'+(cx-3.2).toFixed(1)+'" y1="'+(cy+3.2).toFixed(1)+'" x2="'+(cx+3.2).toFixed(1)+'" y2="'+(cy-3.2).toFixed(1)+'"/></g>'); }).join("");
        var sv=$("#shotSvg"); if(sv) sv.innerHTML='<rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" rx="8" fill="#f3ead9" stroke="#d9c9a8"/><line x1="'+(W/2)+'" y1="2" x2="'+(W/2)+'" y2="'+(H-2)+'" stroke="#d9c9a8" stroke-dasharray="4 4"/><circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="22" fill="none" stroke="#d9c9a8"/>'+dots;
      }
      var LALL=tl({en:"All",ko:"전체",ja:"全体",zh:"全部",es:"Todo",hi:"सभी",vi:"Tất cả",th:"ทั้งหมด",ru:"Все",de:"Alle",fr:"Tout",it:"Tutto"});
      var bs='display:inline-block;padding:4px 10px;margin:0 4px 6px 0;border:1px solid var(--line);border-radius:14px;font-size:12px;font-weight:700;background:#fff;color:var(--navy);cursor:pointer';
      var bsOn='background:var(--navy);color:#fff;border-color:var(--navy)';
      var qbtns=['all','1','2','3','4'].map(function(q){ return '<button class="shotq" data-q="'+q+'" style="'+bs+(q==='all'?';'+bsOn:'')+'">'+(q==='all'?LALL:q+'Q')+'</button>'; }).join('');
      el.innerHTML='<div class="dt-sec-t" style="margin-top:16px">🎯 '+tl({en:"Shot Chart",ko:"슛 차트",ja:"ショットチャート",zh:"投篮图",es:"Mapa de tiros",hi:"शॉट चार्ट",vi:"Biểu đồ ném",th:"แผนภูมิการยิง",ru:"Карта бросков",de:"Wurfkarte",fr:"Carte des tirs",it:"Mappa dei tiri"})+'</div>'+
        '<div>'+qbtns+'</div><svg id="shotSvg" viewBox="0 0 '+W+' '+H+'" style="width:100%;border-radius:10px"></svg>'+
        '<div style="font-size:12px;color:#8a93a3;margin-top:4px"><span style="color:#1b57c4;font-weight:700">●</span> '+esc(g.home)+' &nbsp; <span style="color:#d23b3b;font-weight:700">●</span> '+esc(g.away)+' &nbsp; ✕ '+tl({en:"Miss",ko:"실패",ja:"失敗",zh:"未中",es:"Fallo",hi:"मिस",vi:"Trượt",th:"พลาด",ru:"Промах",de:"Fehlwurf",fr:"Raté",it:"Errore"})+'</div>';
      draw();
      el.querySelectorAll('.shotq').forEach(function(b){ b.onclick=function(){ _q=b.dataset.q; el.querySelectorAll('.shotq').forEach(function(x){ x.setAttribute('style',bs); }); b.setAttribute('style',bs+';'+bsOn); draw(); }; });
    }).catch(function(){ if($("#dtShot"))$("#dtShot").innerHTML=''; });
  }
  function loadBasketballBox(g){

      return h+'</tbody></table>';

      var note=(src==='apisports')?'<p style="color:#8a93a3;font-size:11px;margin-bottom:8px">'+tl({en:"Official end-of-game player stats (API-Sports).",ko:"종료 경기 공식 선수 기록(API-Sports).",ja:"試合終了後の公式選手記録(API-Sports)。",zh:"赛后官方球员数据(API-Sports)。",es:"Estadísticas oficiales de jugadores (API-Sports).",hi:"आधिकारिक खिलाड़ी आँकड़े (API-Sports)।",vi:"Thống kê cầu thủ chính thức (API-Sports).",th:"สถิตินักกีฬาอย่างเป็นทางการ (API-Sports)",ru:"Официальная статистика игроков (API-Sports).",de:"Offizielle Spielerstatistik (API-Sports).",fr:"Stats des joueurs officielles (API-Sports).",it:"Statistiche giocatori ufficiali (API-Sports)."})+'</p>':'';
