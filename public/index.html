  // 경기 흐름(플레이바이플레이) — Q01~Q06: 쿼터별 그룹 + 접기/펼치기 + 전체/득점만 필터
  var _flowMode="all"; // all | score
  function loadBasketballFlow(g){
    dtLoading(); var tk=_dtTok;
    fetch("/api/basketball/live?id="+encodeURIComponent(g.id)).then(function(r){return r.json()}).then(function(j){
      if(!dtFresh(tk))return;
      var raw=(j&&j.events)||[];
      if(!raw.length){ dtBody('<div class="msg"><div class="big">📜</div>'+t("noFlow")+'</div>'); return; }
      // 시간순(과거→최신)으로 정렬: 서버는 최신→과거(reverse)로 내려줌. 양끝 누적점수로 방향 판정.
      var ev=raw.slice();
      var withS=ev.filter(function(e){return e.home!=null&&e.away!=null;});
      if(withS.length>=2 && (withS[0].home+withS[0].away) > (withS[withS.length-1].home+withS[withS.length-1].away)) ev.reverse();
      // 득점 변화(가산점) 계산 + period 보정
      var ph=0,pa=0, derP=1;
      ev.forEach(function(e){
        if(e.period==null){ e.period=derP; var mm=e.text.match(/end of (?:the )?(\d+)(?:st|nd|rd|th)?\s+(?:quarter|half|period)/i); if(mm){derP=Math.max(derP,parseInt(mm[1],10)+1);} else if(/end of (?:overtime|ot)\b/i.test(e.text))derP++; }
        if(e.home!=null&&e.away!=null){ e._dh=e.home-ph; e._da=e.away-pa; e._scored=(e.home!==ph||e.away!==pa); ph=e.home; pa=e.away; }
        else { e._scored=false; e._dh=0; e._da=0; }
      });
      // 쿼터별 그룹(period 오름차순) + 쿼터 득점/누적
      var groups={}, order=[];
      ev.forEach(function(e){ var p=e.period||1; if(!groups[p]){groups[p]=[]; order.push(p);} groups[p].push(e); });
      order.sort(function(a,b){return a-b;});
      var curP=order[order.length-1];
      var isHalves=(j&&j.isHalves)||false;
      var pcum=0,pcumA=0;
      var rows=order.map(function(p){

        var endH=last?last.home:pcum, endA=last?last.away:pcumA;
        var qH=endH-pcum, qA=endA-pcumA; pcum=endH; pcumA=endA;

        var open=(p===curP);
        return {p:p,arr:arr,lbl:lbl,qH:qH,qA:qA,endH:endH,endA:endA,open:open};
      });

      }).join("")||('<div class="fe"><span class="ftx" style="color:#8a93a3">'+t("noScorePlays")+'</span></div>'); }
      var filt='<div class="flw-filt"><button class="fchip'+(_flowMode==="all"?" on":"")+'" data-m="all">'+t("filterAll")+'</button><button class="fchip'+(_flowMode==="score"?" on":"")+'" data-m="score">'+t("scoreOnly")+'</button></div>';
      var body=rows.map(function(r){
        return '<div class="qgrp'+(r.open?" open":"")+'" data-p="'+r.p+'"><div class="qhd"><span class="ql">'+esc(r.lbl)+'</span>'+

      db.querySelectorAll(".fchip").forEach(function(b){ b.onclick=function(){ _flowMode=b.dataset.m; loadBasketballFlow(g); }; });

  // P01·P02 득점 그래프 — 실제 득점 이벤트로 양 팀 누적 점수 계단 그래프 + 좌우/터치 탐색 + 당시 점수·선수 표시.
  function bskScoreGraph(allEv,g){
    var box=$("#bskGraph"); if(!box)return;
    // 시간순(과거→최신) 보정: 공급사 play-by-play는 최신→과거일 수 있음. 양끝 누적점수 합으로 방향 판정.
    var ev=allEv.slice();
    var withS=ev.filter(function(e){return e.home!=null&&e.away!=null;});
    if(withS.length>=2){ var f=withS[0], l=withS[withS.length-1]; if((f.home+f.away)>(l.home+l.away)) ev.reverse(); }
    // 득점(누적 점수가 바뀐) 이벤트만 추출 — 쿼터합계 추정 아님, 실제 이벤트 기반
    var pts=[], ph=0,pa=0, lastP=1;
    ev.forEach(function(e){
      if(e.period!=null){ lastP=e.period; }
      else { if(/end of the (\d+)/i.test(e.text)){ lastP=Math.max(lastP,parseInt(e.text.match(/end of the (\d+)/i)[1],10)+1); } if(/end of (?:overtime|ot)/i.test(e.text)) lastP++; }
      var H=e.home, A=e.away;
      if(H==null||A==null)return;
      if(H!==ph||A!==pa){ pts.push({i:pts.length, h:H, a:A, dh:H-ph, da:A-pa, clock:e.clock||"", text:e.text, team:e.team, period:lastP}); ph=H; pa=A; }
    });
    if(pts.length<2){ box.innerHTML=''; return; }
    var mx=Math.max(1,ph,pa), n=pts.length;
    var W=320,Hh=150,PL=26,PR=8,PT=8,PB=18, iw=W-PL-PR, ih=Hh-PT-PB;
    var X=function(i){ return PL + (n<=1?0:(i/(n-1))*iw); };
    var Y=function(v){ return PT + ih - (v/mx)*ih; };
    // 계단형 path
    function stepPath(key){ var d=''; pts.forEach(function(p,i){ var x=X(i),y=Y(p[key]); if(i===0)d+='M'+x+' '+Y(0)+' L'+x+' '+y; else { var px=X(i-1); d+=' L'+px+' '+y+' L'+x+' '+y; } }); return d; }
    // 쿼터 경계 세로선
    var bounds=''; for(var i=1;i<n;i++){ if(pts[i].period!==pts[i-1].period){ var x=X(i); bounds+='<line x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+ih)+'" stroke="var(--line)" stroke-dasharray="3 3"/>'; } }
    var sel=n-1;
    function render(){
      var p=pts[sel];
      var cx=X(sel);
      var teamNm=p.team===1?g.home:(p.team===2?g.away:"");
      var kind=p.dh+p.da; // 득점 가산점
      var svg='<svg viewBox="0 0 '+W+' '+Hh+'" class="bsg-svg" preserveAspectRatio="none">'+
        '<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="var(--line)"/>'+bounds+
        '<path d="'+stepPath("h")+'" fill="none" stroke="var(--navy)" stroke-width="2"/>'+
        '<path d="'+stepPath("a")+'" fill="none" stroke="var(--red)" stroke-width="2"/>'+
        '<line class="bsg-cur" x1="'+cx+'" y1="'+PT+'" x2="'+cx+'" y2="'+(PT+ih)+'" stroke="#9aa1ad" stroke-dasharray="2 2"/>'+
        '<circle cx="'+cx+'" cy="'+Y(p.h)+'" r="3.5" fill="var(--navy)"/>'+
        '<circle cx="'+cx+'" cy="'+Y(p.a)+'" r="3.5" fill="var(--red)"/>'+
        '<text x="2" y="'+(PT+6)+'" font-size="8" fill="#9aa1ad">'+mx+'</text><text x="2" y="'+(PT+ih)+'" font-size="8" fill="#9aa1ad">0</text>'+
        '</svg>';
      var detail='<div class="bsg-det"><div class="bsg-nav"><button class="bsg-b" id="bsgPrev">‹</button>'+
        '<div class="bsg-mid"><div class="bsg-sc"><b style="color:var(--navy)">'+p.h+'</b> – <b style="color:var(--red)">'+p.a+'</b></div>'+
        '<div class="bsg-meta">'+(pts[sel].period?(periodColLabel("basketball",pts[sel].period-1,false)+' · '):'')+esc(p.clock)+(teamNm?' · '+esc(teamNm):'')+(kind>0?' · +'+kind:'')+'</div>'+
        '<div class="bsg-tx">'+esc(p.text)+'</div></div>'+
        '<button class="bsg-b" id="bsgNext">›</button></div>'+
        '<div class="bsg-lg"><span class="lh">■</span> '+esc(g.home)+' <span class="la">■</span> '+esc(g.away)+' · '+t("curScoreLbl")+'</div></div>';
      box.innerHTML='<div class="dt-sec-t">📈 '+t("scoreGraph")+'</div><div class="bsg-wrap">'+svg+'</div>'+detail;
      var sv=box.querySelector('.bsg-svg');
      if(sv){ sv.onclick=function(ev2){ var r=sv.getBoundingClientRect(); var rx=(ev2.clientX-r.left)/r.width*W; var best=0,bd=1e9; for(var k=0;k<n;k++){ var dd=Math.abs(X(k)-rx); if(dd<bd){bd=dd;best=k;} } sel=best; render(); }; }
      var pv=$("#bsgPrev"); if(pv)pv.onclick=function(){ if(sel>0){sel--;render();} };
      var nx=$("#bsgNext"); if(nx)nx.onclick=function(){ if(sel<n-1){sel++;render();} };
    }
    render();
  }

  function openStandings(sport,league,g){
    var o=overlay("ovRank");

      $("#rkBack").onclick=function(){ closeOverlay("ovRank"); };
      fetch("/api/rank?sport="+encodeURIComponent(sport)+(league?"&league="+encodeURIComponent(league):"")).then(function(r){return r.json()}).then(function(j){
        var tb=(j&&j.table)||[];
        if(!tb.length){
          // 원인 구분 보고(준비 중으로 뭉뚱그리지 않음)
          var reason=(j&&j.note==="unmapped")
            ? tl({en:"This league isn't covered by our standings provider yet.",ko:"이 리그는 순위 제공처에서 아직 지원하지 않습니다.",ja:"このリーグは順位提供元で未対応です。",zh:"数据提供方暂不支持该联赛排名。",es:"Liga no cubierta aún.",hi:"यह लीग अभी समर्थित नहीं।",vi:"Giải chưa được hỗ trợ.",th:"ผู้ให้บริการยังไม่รองรับลีกนี้",ru:"Лига пока не поддерживается.",de:"Liga noch nicht abgedeckt.",fr:"Ligue non couverte.",it:"Lega non ancora coperta."})+'<br><span style="font-size:11px;color:#9aa1ad">'+esc(g.league||"")+'</span>'
            : soonMsg;

        }
        // 표는 항상 표시 + 두 팀 강조(이름이 안 맞아도 숨기지 않음). 매칭 실패 시 안내만.
        var norm=function(s){return String(s||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"");};
        var nh=norm(g.home),na=norm(g.away);

  function openNews(){

    var TABS=[["all","all","📰"],["soccer","football","⚽"],["nba","basketball","🏀"],["mlb","baseball","⚾"],["nhl","hockey","🏒"]];
    var cur=({basketball:"nba",football:"soccer",baseball:"mlb",hockey:"nhl"})[S.sport]||"all";
    var srcTxt=tl({en:"Read original",ko:"원문 보기",ja:"原文を見る",zh:"查看原文",es:"Ver original",hi:"मूल देखें",vi:"Xem gốc",th:"อ่านต้นฉบับ",ru:"Оригинал",de:"Original lesen",fr:"Lire l'original",it:"Leggi originale"});

      var seg='<div class="news-seg">'+TABS.map(function(x){return '<button class="cchip'+(cur===x[0]?" on":"")+'" data-nc="'+x[0]+'">'+x[2]+' <span>'+(x[1]==="all"?t("news"):t(x[1]))+'</span></button>';}).join("")+'</div>';

      o.innerHTML=h;

      o.querySelectorAll("[data-nc]").forEach(function(b){ b.onclick=function(){ cur=b.dataset.nc; render(); }; });
      load();
    }
    function load(){
      var tk=cur;
      fetch("/api/news?cat="+encodeURIComponent(cur)).then(function(r){return r.json()}).then(function(j){
        if(tk!==cur||!$("#nwBody"))return;   // 늦은 응답이 다른 탭 덮지 않게

          var ti=n.title||n.headline||""; var when=n.pubDate||n.published||n.date||"";

          return '<a class="sv-save" href="'+esc(link)+'" target="_blank" rel="noopener">'+(img?'<img src="'+esc(img)+'" onerror="this.style.display=\'none\'">':'<div style="width:92px;flex:0 0 auto;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px">📰</div>')+'<div class="sc"><div class="tt">'+esc(ti)+'</div><div class="mt">'+srcTxt+' <span style="font-size:11px">↗</span> <span style="color:var(--muted);font-weight:600">· ESPN'+(when?' · '+esc(String(when).slice(0,16)):'')+'</span></div></div></a>';
        }).join("");

  function loadGoogle(){
    if(!window.__gcid){ // /api/config 에서 구글 클라이언트ID 가져오기
      fetch("/api/config").then(function(r){return r.json()}).then(function(c){ window.__gcid=(c&&c.googleClientId)||""; initGoogle(); }).catch(function(){ gFallback(); });
    } else initGoogle();
  }

      updateDetailHead();
      var sig=(g.hs==null?"-":g.hs)+":"+(g.as==null?"-":g.as)+":"+(g.state||"")+":"+(g.period||"")+":"+(g.status||"")+":"+((g.setScores||[]).map(function(p){return p.home+"/"+p.away;}).join(","));
      if(sig!==_dtLastSig){ _dtLastSig=sig; if(_dt.tab==="overview"){ if(sport==="volleyball")loadVolleyOverview(g); else renderOverview(g,sport); } }   // 점수/상태/세트 바뀌면 개요만 재렌더(종목별 라우팅)
    }).catch(function(){ _dtSyncing=false; });
  }
  // 상세 헤더(점수·상태·시계)만 제자리 갱신 — 탭 내용·스크롤 보존
  function updateDetailHead(){
    var d=$("#detail"); if(!d||!_dt)return; var g=_dt.g;
    var mid=d.querySelector(".dt-head .mid"); if(!mid)return;
    var live=stateOf(g)==="live";
    mid.innerHTML=(stateOf(g)==="scheduled"?('<div class="big t">'+hhmm(g.date)+'</div><div class="stt">'+t("startSoon")+'</div>'):('<div class="big">'+fmtScore(g)+'</div><div class="stt'+(live?" live":"")+'">'+statusText(g)+'</div>'));
  }
  // 상세 점수 폴러(상세 열려있고 보일 때만, 12초). 종료 경기면 자동 정지.
  var _dtPoll=setInterval(function(){ if(_dt&&$("#detail")&&document.visibilityState==="visible")syncDetailScore(); },12000);
  // 실데이터 주기 갱신 (탭이 보일 때만 — 백그라운드에선 폴링 중단)
  setInterval(function(){ if(document.visibilityState==="visible")pollSync(); },15000);
  // 복귀·네트워크 복구 즉시 동기화(visibilitychange·pageshow·online·focus 병합, 1.2초 디바운스로 중복 요청 방지) — I02
  var _lastForce=0;
  function forceSync(reason){ var now=Date.now(); if(now-_lastForce<1200)return; _lastForce=now;
    if($("#detail")){ syncDetailScore(true); }   // 상세 보는 중이면 상세 점수부터 즉시 재동기화
    pollSync();                                   // 목록/빅매치(홈·라이브·관심) 재동기화(상세 중이면 내부에서 스킵)
  }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible")forceSync("vis"); });
  // bfcache 복원(뒤로가기·iOS 앱 복귀)은 visibilitychange가 안 뜰 수 있어 pageshow로 보강 — I02
  window.addEventListener("pageshow",function(e){ if(e.persisted||(performance.getEntriesByType&&(performance.getEntriesByType("navigation")[0]||{}).type==="back_forward"))forceSync("bfcache"); else forceSync("show"); });
  // 네트워크 복구(와이파이↔데이터 전환·오프라인→복구) 즉시 최신 요청 — I02
  window.addEventListener("online",function(){ forceSync("online"); });
  window.addEventListener("focus",function(){ if(document.visibilityState==="visible")forceSync("focus"); });

  // ====== 명령서2: 보던 화면 상태 저장 훅 ======
  // 새로고침/이탈 직전에 현재 상태 저장(스크롤 포함). 스크롤 중에도 가볍게 갱신.
  window.addEventListener("pagehide", snapView);
  window.addEventListener("beforeunload", snapView);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") snapView(); });
  var _svTick=0;
  window.addEventListener("scroll", function(){ var n=Date.now(); if(n-_svTick<400)return; _svTick=n; snapView(); }, {passive:true});

  // ====== 명령서3: 좌우 스와이프로 종목 전환 ======
  // 목록 화면(홈/라이브/관심)에서만. 상세·오버레이가 열려 있거나, 가로 스크롤 요소(종목탭·리그칩·표·차트) 위에서 시작한 스와이프는 무시.
  (function(){
    var sx=0, sy=0, st=0, active=false;
    function horizScrollAncestor(node){
      for(var e=node; e&&e!==document.body; e=e.parentElement){
        try{ var cs=getComputedStyle(e); var ox=cs.overflowX;
          if((ox==="auto"||ox==="scroll")&&e.scrollWidth>e.clientWidth+4) return true;
        }catch(_){}
        if(e.className&&/sporttabs|cchips|rk-chips|news-seg|dt-tabs|shotwrap|flowwrap|hl-|carousel|segb|seg\b/.test(String(e.className))) return true;
        if(e.tagName==="TABLE"||e.tagName==="SVG"||e.tagName==="CANVAS"||e.tagName==="INPUT"||e.tagName==="TEXTAREA"||e.tagName==="SELECT") return true;
      }
      return false;
    }
    function listScreen(){ return S.screen==="home"||S.screen==="live"||S.screen==="fav"; }
    function switchBy(dir){   // dir +1=다음 종목(오른쪽 탭), -1=이전 종목
      var idx=-1; for(var i=0;i<SPORTS.length;i++){ if(SPORTS[i].k===S.sport){ idx=i; break; } }
      if(idx<0)return; var ni=idx+dir; if(ni<0||ni>=SPORTS.length)return;   // 양끝에서는 넘기지 않음(탭과 동일)
      var nk=SPORTS[ni].k; if(nk===S.sport)return;
      S.sport=nk; S.country=""; S.leagueF=""; S.filter="live"; load();   // 종목 전환 시 진행 중 우선(없으면 자동 전체)
      // 활성 탭이 보이도록 탭바 가로 스크롤
      try{ var tb=$("#sporttabs"); var btn=tb&&tb.querySelectorAll(".stab")[ni]; if(btn&&btn.scrollIntoView)btn.scrollIntoView({inline:"center",block:"nearest"}); }catch(_){}
      snapView();
    }
    document.addEventListener("touchstart", function(e){
      if(!e.touches||e.touches.length!==1){ active=false; return; }
      if(document.querySelector(".detail")){ active=false; return; }   // 상세/오버레이 열림 → 무시
      if(!listScreen()){ active=false; return; }
      if(horizScrollAncestor(e.target)){ active=false; return; }
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); active=true;
    }, {passive:true});
    document.addEventListener("touchend", function(e){
      if(!active)return; active=false;
      if(document.querySelector(".detail")||!listScreen())return;
      var t=(e.changedTouches&&e.changedTouches[0]); if(!t)return;
      var dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
      if(dt>700)return;                                   // 너무 느린 제스처 제외
      if(Math.abs(dx)<60)return;                          // 이동량 부족
      if(Math.abs(dx)<Math.abs(dy)*1.8)return;            // 세로 스크롤과 구분
      switchBy(dx<0?1:-1);                                // 왼쪽으로 밀면 다음 종목
    }, {passive:true});
  })();

  // 경기 공유 딥링크 ?ev=<sport>:<id> — 종목 먼저 설정 후 로드, 경기 로드되면 상세 자동 오픈
  var _evDeep=(function(){ try{ var m=(location.search.match(/[?&]ev=([^&]+)/)||[])[1]; if(!m)return null; m=decodeURIComponent(m); var p=m.split(":"); var sp=p[0], id=p.slice(1).join(":"); if(!sp||!id)return null; var SPK={football:1,baseball:1,basketball:1,volleyball:1,hockey:1,esports:1}; if(!SPK[sp])return null; S.sport=sp; S.date=todayStr(); return {sp:sp,id:id}; }catch(e){ return null; } })();

  // 명령서2: 저장된 보던 화면 복원(딥링크가 있으면 딥링크 우선). load() 전에 S를 복원해야 올바른 종목·날짜로 로드됨.
  var _restoreView=null;
  if(!_evDeep){
    var _vw=readView();
    if(_vw&&_vw.v===1){
      var SPK2={football:1,baseball:1,basketball:1,volleyball:1,hockey:1,esports:1};
      if(SPK2[_vw.sport]) S.sport=_vw.sport;
      if(typeof _vw.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(_vw.date)) S.date=_vw.date;
      if(_vw.filter) S.filter=_vw.filter;
      if(_vw.screen) S.screen=_vw.screen;
      if(_vw.base) S.base=_vw.base;
      S.country=_vw.country||""; S.leagueF=_vw.leagueF||"";
      if(_vw.pin){ S.pinLeague[S.sport]=_vw.pin; }
      _restoreView=_vw;   // 스크롤·상세 재오픈은 데이터 로드 후 복원
    }
  }
  bind(); load();
  // 명령서2: 데이터가 들어오면 스크롤 위치 복원 + (열려 있던) 매치 상세 자동 재오픈
  if(_restoreView){ (function(rv){
    var tries=0, want=rv.sport+"|"+rv.date;
    var iv=setInterval(function(){
      tries++;
      var d=S.data[key()];
      var ready=(key()===want)&&d&&(d.games||d.error||d.unsupported||d.needKey);
      if(ready){
        clearInterval(iv);
        // 상세가 열려 있었다면 해당 경기를 찾아 재오픈(없으면 조용히 목록만 복원)
        if(rv.detail&&rv.detail.id!=null&&d.games){
          var g=d.games.filter(function(x){return String(x.id)===String(rv.detail.id);})[0];
          if(g){ try{ openDetail(g, rv.detail.tab==="box"?"pitchers":(rv.detail.tab==="lineup"?"lineup":(rv.detail.tab==="chat"?"chat":null))); }catch(e){} return; }
        }
        // 목록 화면이면 보던 스크롤로 복원
        if(S.screen==="home"||S.screen==="live"||S.screen==="fav"){ try{ window.scrollTo(0, rv.scroll||0); }catch(e){} }
      } else if(tries>16){ clearInterval(iv); }
    }, 250);
  })(_restoreView); }
  if(_evDeep){ var _tries=0; var _dl=setInterval(function(){ _tries++; var d=S.data[_evDeep.sp+"|"+S.date]; if(d&&d.games){ var g=d.games.filter(function(x){return String(x.id)===String(_evDeep.id);})[0]; clearInterval(_dl); if(g){ openDetail(g); } else { toastMsg(tl({en:"Match not found or already finished.",ko:"경기를 찾지 못했거나 종료되었습니다.",ja:"試合が見つからないか終了しました。",zh:"未找到或已结束。",es:"Partido no encontrado o finalizado.",hi:"मैच नहीं मिला।",vi:"Không tìm thấy trận.",th:"ไม่พบแมตช์",ru:"Матч не найден.",de:"Spiel nicht gefunden.",fr:"Match introuvable.",it:"Partita non trovata."}),1); } } else if(_tries>14){ clearInterval(_dl); } },500); }
  // PWA: 서비스워커 등록(설치형 앱·오프라인 폴백) — 네트워크 우선이라 항상 최신 우선
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("/sw.js").catch(function(){}); navigator.serviceWorker.addEventListener("message",function(e){ var m=e.data||{}; if(m.type==="push"){ addInbox({title:m.title,body:m.body,ev:m.ev||""}); } else if(m.type==="openEvent"&&m.gameId){ /* 알림 클릭 → 경기 열기 */ } }); }catch(e){} }
  updateBellBadge();
  // 방문 기록(기존 추적과 동일 엔드포인트)
  try{ fetch("/api/track",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({t:"visit",p:"v2",l:"ko"})}).catch(function(){}); }catch(e){}
})();
</script>
