<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>LIVE UP · 관리자</title>
<style>
  :root{--navy:#16243d;--gold:#e0a92e;--line:#e6e9ef;--dim:#8b93a0;--bg:#f4f6fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--bg);color:var(--navy)}
  a{color:inherit}
  /* 로그인 */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 28px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(20,36,61,.12);text-align:center}
  .logo{font-size:26px;font-weight:900;font-style:italic;color:var(--gold);margin-bottom:2px}
  .logo b{color:#3d7ecc}
  .sub{color:var(--dim);font-size:12px;letter-spacing:.5px;margin-bottom:22px}
  .gate h1{font-size:17px;margin:0 0 16px}
  .gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:12px;outline:none}
  .gate input:focus{border-color:var(--gold)}
  .gate button{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#f6d67a,#e0a92e);color:#2a1e05;font-weight:800;font-size:15px;cursor:pointer}
  .gate .err{color:#e2231a;font-size:12.5px;min-height:16px;margin-top:8px}
  /* 대시보드 */
  .wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px;display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .top .brand{font-size:20px;font-weight:900;font-style:italic;color:var(--navy)}
  .top .brand span{color:var(--gold)}
  .top .tools{display:flex;gap:8px;align-items:center}
  .btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--navy)}
  .btn.g{background:var(--navy);color:#fff;border-color:var(--navy)}
  .persist{font-size:12px;padding:6px 11px;border-radius:20px;font-weight:700}
  .persist.on{background:#e7f7ee;color:#12854a}
  .persist.off{background:#fdeceb;color:#c0392b}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px}
  .card .k{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:6px}
  .card .v{font-size:28px;font-weight:900;letter-spacing:-.5px}
  .card .v small{font-size:13px;color:var(--dim);font-weight:700;margin-left:3px}
  .card.hl{background:linear-gradient(135deg,#1a2740,#0b0f16);border-color:#0b0f16;color:#fff}
  .card.hl .k{color:#aab4c4}
  .card.hl .v{color:#fff}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel .hd{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .panel .hd .cnt{color:var(--dim);font-weight:700;font-size:12.5px}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;padding:10px 14px;background:#fafbfc;color:var(--dim);font-weight:700;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:11px 14px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .u{display:flex;align-items:center;gap:9px}
  .u img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#e6e9ef}
  .u .ph{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .mail{color:#3d6fbf}
  .badge-v{font-size:11px;color:#12854a;font-weight:800}
  .badge-nv{font-size:11px;color:var(--dim)}
  .muted{color:var(--dim)}
  .empty{padding:40px 16px;text-align:center;color:var(--dim)}
  /* 이벤트/상품 패널 */
  .pbody{padding:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;color:var(--dim);font-weight:700}
  .fld input,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;font-family:inherit}
  .fld input:focus,.fld textarea:focus{border-color:var(--gold)}
  .fld textarea{width:100%;min-height:96px;resize:vertical}
  .sw{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:14px}
  .sw input{width:0;height:0;opacity:0;position:absolute}
  .sw .track{width:46px;height:26px;border-radius:20px;background:#cfd6e0;position:relative;transition:.2s;cursor:pointer;flex:0 0 auto}
  .sw .track::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sw input:checked + .track{background:#12854a}
  .sw input:checked + .track::after{left:23px}
  .poolstat{display:flex;gap:18px;margin:6px 0 14px;font-size:13px}
  .poolstat b{font-size:20px;display:block}
  .poolstat .left b{color:#12854a}
  .msg{font-size:12.5px;min-height:16px;margin-top:6px}
  .msg.ok{color:#12854a}.msg.no{color:#c0392b}
  .bclist-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
  .bclist{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .bcrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f0f2f6;font-size:13px}
  .bcrow:last-child{border-bottom:none}
  .bcrow .bccode{font-weight:800;letter-spacing:.5px;flex:0 0 auto;min-width:130px}
  .bcrow .bcstat{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
  .bcrow .bcstat.left{background:#e7f7ee;color:#12854a}
  .bcrow .bcstat.used{background:#fdece9;color:#c0392b}
  .bcrow .bcto{color:var(--dim);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}}
</style>
</head>
<body>

<!-- 로그인 게이트 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="logo">LIVE<b>UP</b></div>
    <div class="sub">ADMIN CONSOLE</div>
    <h1>🔐 관리자 로그인</h1>
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="loginBtn">로그인</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- 대시보드 -->
<div class="wrap" id="wrap">
  <div class="top">
    <div class="brand">LIVE<span>UP</span> · 관리자</div>
    <div class="tools">
      <span class="persist" id="persist"></span>
      <button class="btn" id="refresh">↻ 새로고침</button>
      <button class="btn g" id="logout">로그아웃</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div class="k">총 회원</div><div class="v" id="cTotal">–</div></div>
    <div class="card"><div class="k">오늘 신규</div><div class="v" id="cToday">–</div></div>
    <div class="card"><div class="k">이번 주 신규</div><div class="v" id="cWeek">–</div></div>
    <div class="card hl"><div class="k">현재 접속</div><div class="v" id="cOnline">–</div></div>
  </div>

  <!-- 🎁 이벤트 / 상품 (회원가입 즉시지급 룰렛) -->
  <div class="panel" style="margin-bottom:20px">
    <div class="hd"><span>🎁 회원가입 즉시지급 룰렛</span>
      <label class="sw"><input type="checkbox" id="rlEnabled"><span class="track"></span><span id="rlEnLbl">OFF</span></label>
    </div>
    <div class="pbody">
      <div class="row">
        <div class="fld"><label>당첨 확률 (%)</label><input type="number" id="rlRate" min="0" max="100" step="1" style="width:110px"></div>
        <div class="fld"><label>상품명</label><input type="text" id="rlName" style="width:200px" placeholder="5,000원 상품권"></div>
        <button class="btn g" id="rlSave" style="height:40px">설정 저장</button>
      </div>
      <div class="poolstat">
        <div>등록 바코드<b id="poolTotal">0</b></div>
        <div>지급됨<b id="poolUsed">0</b></div>
        <div class="left">잔여<b id="poolLeft">0</b></div>
      </div>
      <!-- 바코드 개별 현황 -->
      <div class="bclist-hd">
        <span style="font-weight:800;font-size:13px">📋 바코드 현황</span>
        <select id="bcFilter" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px">
          <option value="left">잔여만</option>
          <option value="all">전체</option>
          <option value="used">지급됨만</option>
        </select>
        <button class="btn" id="bcCopyLeft">잔여 바코드 복사</button>
        <button class="btn" id="bcClearUnused" style="color:#c0392b;border-color:#f0c9c5">잔여 삭제</button>
      </div>
      <div class="bclist" id="bcList"><div class="muted" style="padding:14px;font-size:12.5px">바코드를 등록하면 여기에 목록이 표시됩니다.</div></div>
      <div class="fld" style="margin-bottom:8px">
        <label>바코드 등록 (한 줄에 하나씩, 5,000원권 100개 붙여넣기)</label>
        <textarea id="rlCodes" placeholder="ABC-1234-5678&#10;DEF-2345-6789&#10;..."></textarea>
      </div>
      <button class="btn g" id="rlAddCodes">바코드 추가</button>
      <span class="msg" id="rlMsg"></span>
      <div style="height:1px;background:var(--line);margin:18px 0"></div>
      <div style="font-weight:800;font-size:13.5px;margin-bottom:10px">🎯 특정 회원에게 상품 지급</div>
      <div class="row">
        <div class="fld"><label>회원 이메일</label><input type="email" id="grEmail" style="width:240px" placeholder="user@gmail.com"></div>
        <div class="fld"><label>바코드 (비우면 '꽝'으로 지급)</label><input type="text" id="grCode" style="width:200px" placeholder="ABC-1234-5678"></div>
        <button class="btn g" id="grBtn" style="height:40px">지급하기</button>
      </div>
      <span class="msg" id="grMsg"></span>
    </div>
  </div>

  <div class="panel">
    <div class="hd"><span>👥 회원 목록 <span class="muted" style="font-weight:600">(최신 가입순)</span></span><span class="cnt" id="uCnt"></span></div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>회원</th><th>이메일</th><th>가입일</th><th class="hide-m">최근 접속</th><th>인증</th><th>상품(당첨/총)</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">아직 가입한 회원이 없습니다.</div>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  let KEY = sessionStorage.getItem('liveup_admin_key') || '';

  function fmt(ts){
    if(!ts) return '<span class="muted">–</span>';
    const d = new Date(ts);
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function initial(name){ const n=(name||'?').trim(); return n ? n[0].toUpperCase() : '?'; }

  async function api(path){
    const r = await fetch(path, { headers: { 'x-admin-key': KEY } });
    if(r.status===401){ throw new Error('unauthorized'); }
    return r.json();
  }
  async function apiPost(path, body){
    const r = await fetch(path, { method:'POST', headers: { 'x-admin-key': KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body||{}) });
    if(r.status===401){ throw new Error('unauthorized'); }
    return r.json();
  }

  // 🎁 룰렛/상품 현황 로드 + 반영
  let BARCODES = [];
  async function loadRoulette(){
    try{
      const d = await api('/api/admin/roulette');
      if(!d || !d.ok) return;
      $('#rlEnabled').checked = !!d.cfg.enabled;
      $('#rlEnLbl').textContent = d.cfg.enabled ? 'ON' : 'OFF';
      $('#rlRate').value = Math.round((d.cfg.winRate||0)*100);
      $('#rlName').value = d.cfg.prizeName||'';
      $('#poolTotal').textContent = d.pool.total;
      $('#poolUsed').textContent = d.pool.used;
      $('#poolLeft').textContent = d.pool.left;
      BARCODES = d.list || [];
      renderBarcodes();
    }catch(e){ if(String(e.message)==='unauthorized') logout(); }
  }
  function renderBarcodes(){
    const f = $('#bcFilter').value;
    let rows = BARCODES;
    if(f==='left') rows = rows.filter(b=>!b.used);
    else if(f==='used') rows = rows.filter(b=>b.used);
    const box = $('#bcList');
    if(!BARCODES.length){ box.innerHTML = '<div class="muted" style="padding:14px;font-size:12.5px">바코드를 등록하면 여기에 목록이 표시됩니다.</div>'; return; }
    if(!rows.length){ box.innerHTML = '<div class="muted" style="padding:14px;font-size:12.5px">해당 조건의 바코드가 없습니다.</div>'; return; }
    box.innerHTML = rows.map(b=>{
      const stat = b.used ? '<span class="bcstat used">지급됨</span>' : '<span class="bcstat left">잔여</span>';
      const to = b.used ? `<span class="bcto">${esc((b.to&&b.to.name)||'')} ${esc((b.to&&b.to.email)||'')} · ${b.ts?fmt(b.ts):''}</span>` : '<span class="bcto"></span>';
      const del = b.used ? '' : `<button class="bcdel" data-code="${esc(b.code)}" title="삭제">✕</button>`;
      return `<div class="bcrow"><span class="bccode">${esc(b.code)}</span>${stat}${to}${del}</div>`;
    }).join('');
    box.querySelectorAll('.bcdel').forEach(el=>el.addEventListener('click', async ()=>{
      const code = el.dataset.code;
      if(!confirm(`바코드 "${code}" 삭제할까요?`)) return;
      try{ const d = await apiPost('/api/admin/roulette/delete-code', { code });
        if(d.ok){ loadRoulette(); } else { alert(d.error==='already-used'?'이미 지급된 바코드는 삭제할 수 없어요.':'삭제 실패'); }
      }catch(e){ alert('삭제 실패'); }
    }));
  }
  async function saveRlConfig(){
    const enabled = $('#rlEnabled').checked;
    const winRate = Number($('#rlRate').value)||0;
    const prizeName = $('#rlName').value.trim();
    const m = $('#rlMsg'); m.className='msg';
    try{ const d = await apiPost('/api/admin/roulette/config', { enabled, winRate, prizeName });
      if(d.ok){ m.className='msg ok'; m.textContent='저장됨 ✓ (당첨확률 '+Math.round(d.cfg.winRate*100)+'%)'; $('#rlEnLbl').textContent = d.cfg.enabled?'ON':'OFF'; }
      else { m.className='msg no'; m.textContent = d.error||'저장 실패'; }
    }catch(e){ m.className='msg no'; m.textContent='실패'; }
  }
  async function addCodes(){
    const codes = $('#rlCodes').value;
    const m = $('#rlMsg'); m.className='msg';
    if(!codes.trim()){ m.className='msg no'; m.textContent='바코드를 입력하세요.'; return; }
    try{ const d = await apiPost('/api/admin/roulette/barcodes', { codes });
      if(d.ok){ m.className='msg ok'; m.textContent=`${d.added}개 추가됨 · 총 ${d.total}개 · 잔여 ${d.left}개`; $('#rlCodes').value=''; loadRoulette(); }
      else { m.className='msg no'; m.textContent=d.error||'실패'; }
    }catch(e){ m.className='msg no'; m.textContent='실패'; }
  }
  async function grant(){
    const email = $('#grEmail').value.trim(); const code = $('#grCode').value.trim();
    const m = $('#grMsg'); m.className='msg';
    if(!email){ m.className='msg no'; m.textContent='이메일을 입력하세요.'; return; }
    try{ const d = await apiPost('/api/admin/grant', { email, code });
      if(d.ok){ m.className='msg ok'; m.textContent=`${d.to.name} 님에게 지급 완료 (${code?'바코드':'꽝'})`; $('#grEmail').value=''; $('#grCode').value=''; load(); }
      else { m.className='msg no'; m.textContent = d.error==='user-not-found'?'해당 이메일 회원을 찾을 수 없어요.':(d.error||'실패'); }
    }catch(e){ m.className='msg no'; m.textContent='실패'; }
  }

  async function load(){
    try{
      const [st, us] = await Promise.all([ api('/api/admin/stats'), api('/api/admin/users') ]);
      $('#cTotal').textContent = (st.total||0).toLocaleString();
      $('#cToday').innerHTML = (st.todayNew||0).toLocaleString() + '<small>명</small>';
      $('#cWeek').innerHTML = (st.weekNew||0).toLocaleString() + '<small>명</small>';
      $('#cOnline').innerHTML = (st.online||0).toLocaleString() + '<small>명</small>';
      const pe = $('#persist');
      if(st.persist){ pe.className='persist on'; pe.textContent='🟢 DB 연결됨 (영구 저장)'; }
      else { pe.className='persist off'; pe.textContent='⚠️ 메모리 모드 (재시작 시 초기화)'; }

      const users = us.users||[];
      $('#uCnt').textContent = users.length + '명';
      const rows = $('#rows'); rows.innerHTML='';
      $('#empty').style.display = users.length ? 'none' : 'block';
      users.forEach(u=>{
        const tr = document.createElement('tr');
        const pic = u.picture ? `<img src="${esc(u.picture)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(initial(u.name))}'}))">` : `<div class="ph">${esc(initial(u.name))}</div>`;
        tr.innerHTML = `
          <td><div class="u">${pic}<b>${esc(u.name||'이름없음')}</b></div></td>
          <td class="mail">${esc(u.email||'')||'<span class=muted>–</span>'}</td>
          <td>${fmt(u.first)}</td>
          <td class="hide-m muted">${fmt(u.last)}</td>
          <td>${u.verified?'<span class="badge-v">✓ 인증</span>':'<span class="badge-nv">미인증</span>'}</td>
          <td><b style="color:#12854a">${u.won||0}</b> <span class="muted">/ ${u.prizes||0}</span></td>`;
        rows.appendChild(tr);
      });
    }catch(e){
      if(String(e.message)==='unauthorized'){ logout(); }
    }
    loadRoulette();
  }

  function showDash(){ $('#gate').style.display='none'; $('#wrap').style.display='block'; load(); }
  function logout(){ sessionStorage.removeItem('liveup_admin_key'); KEY=''; $('#wrap').style.display='none'; $('#gate').style.display='flex'; $('#pw').value=''; }

  async function login(){
    const pw = $('#pw').value.trim();
    $('#err').textContent='';
    if(!pw){ $('#err').textContent='비밀번호를 입력하세요.'; return; }
    try{
      const r = await fetch('/api/admin/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: pw }) });
      const j = await r.json();
      if(j.ok){ KEY=pw; sessionStorage.setItem('liveup_admin_key',pw); showDash(); }
      else { $('#err').textContent = j.error || '비밀번호가 올바르지 않습니다.'; }
    }catch(e){ $('#err').textContent='서버 연결 실패. 잠시 후 다시 시도하세요.'; }
  }

  $('#loginBtn').addEventListener('click', login);
  $('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
  $('#refresh').addEventListener('click', load);
  $('#logout').addEventListener('click', logout);
  // 🎁 룰렛/상품 이벤트
  $('#rlEnabled').addEventListener('change', ()=>{ $('#rlEnLbl').textContent = $('#rlEnabled').checked?'ON':'OFF'; });
  $('#rlSave').addEventListener('click', saveRlConfig);
  $('#rlAddCodes').addEventListener('click', addCodes);
  $('#grBtn').addEventListener('click', grant);
  $('#bcFilter').addEventListener('change', renderBarcodes);
  $('#bcCopyLeft').addEventListener('click', ()=>{
    const left = BARCODES.filter(b=>!b.used).map(b=>b.code);
    const m = $('#rlMsg'); m.className='msg';
    if(!left.length){ m.className='msg no'; m.textContent='잔여 바코드가 없습니다.'; return; }
    try{ navigator.clipboard.writeText(left.join('\n')); m.className='msg ok'; m.textContent=`잔여 ${left.length}개 바코드 복사됨 ✓ (다른 이벤트에 재사용 가능)`; }
    catch(e){ m.className='msg no'; m.textContent='복사 실패 — 브라우저 권한 확인'; }
  });
  $('#bcClearUnused').addEventListener('click', async ()=>{
    const left = BARCODES.filter(b=>!b.used).length;
    if(!left){ const m=$('#rlMsg'); m.className='msg no'; m.textContent='삭제할 잔여 바코드가 없습니다.'; return; }
    if(!confirm(`미사용(잔여) 바코드 ${left}개를 목록에서 삭제할까요?\n(지급된 바코드 이력은 유지됩니다)`)) return;
    try{ const d = await apiPost('/api/admin/roulette/clear-unused', {});
      const m=$('#rlMsg'); if(d.ok){ m.className='msg ok'; m.textContent=`잔여 ${d.removed}개 삭제됨`; loadRoulette(); }
      else { m.className='msg no'; m.textContent=d.error||'실패'; }
    }catch(e){ const m=$('#rlMsg'); m.className='msg no'; m.textContent='실패'; }
  });

  // 저장된 키가 있으면 자동 검증 후 대시보드
  if(KEY){ api('/api/admin/stats').then(j=>{ if(j&&j.ok) showDash(); else logout(); }).catch(()=>logout()); }
  // 30초마다 자동 새로고침
  setInterval(()=>{ if($('#wrap').style.display==='block') load(); }, 30000);
</script>
</body>
</html>
