<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>LIVE UP · Multi-Sport LIVE SIMULATION</title>
<style>
  :root{--bg:#0a0e15;--card:#121a26;--card2:#0f1620;--line:#243044;--gold:#f5c451;--blue:#3d7dff;--blue2:#8fd0ff;--red:#e2231a;--txt:#eef3fa;--sub:#8592a5;--home:#e2231a;--away:#3d7dff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:radial-gradient(130% 100% at 50% -10%,#14202f,#0a0e15 60%);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo",Roboto,"Malgun Gothic",sans-serif;padding:12px;line-height:1.4}
  .wrap{max-width:440px;margin:0 auto}
  .topbar{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
  .topbar select,.sporttabs button{border:1px solid var(--line);background:#101826;color:var(--txt);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer}
  .sporttabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
  .sporttabs button.on{background:linear-gradient(135deg,#20406e,#2b5aa0);border-color:#3a5f9e}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.4)}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 6px}
  .sim{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:12.5px;letter-spacing:.4px}
  .sim .dot{width:8px;height:8px;border-radius:50%;background:#ff453a;box-shadow:0 0 0 0 rgba(255,69,58,.6);animation:blip 1.3s infinite}
  @keyframes blip{70%{box-shadow:0 0 0 7px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
  .lg{font-size:10px;color:var(--sub)}
  .scorebar{display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 14px 4px}
  .tm{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;flex:1;min-width:0}
  .tm.h{justify-content:flex-end;text-align:right}
  .tm .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none}
  .tm.h .badge{background:var(--home);color:#fff}
  .tm.a .badge{background:#fff;color:#123;border:2px solid var(--away)}
  .sc{font-weight:900;font-size:23px;letter-spacing:2px;font-variant-numeric:tabular-nums}
  .sc .p{display:inline-block}
  .sc .p.pop{animation:scP .55s cubic-bezier(.22,1,.36,1)}
  @keyframes scP{0%{transform:scale(.85);color:var(--blue2)}45%{transform:scale(1.18);color:var(--blue2);text-shadow:0 0 14px rgba(61,125,255,.9)}100%{transform:scale(1)}}
  .clk{text-align:center;color:var(--sub);font-size:11px;padding-bottom:7px;font-variant-numeric:tabular-nums}
  .clk b{color:var(--gold)}
  .stage{position:relative;background:#0b1119;overflow:hidden}
  svg.field{display:block;width:100%;height:auto}
  .ev{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.85);opacity:0;background:rgba(5,12,25,.82);border:1px solid rgba(140,180,255,.28);border-radius:14px;padding:10px 16px;text-align:center;pointer-events:none;transition:opacity .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1);min-width:150px;backdrop-filter:blur(5px)}
  .ev.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ev .big{font-size:21px;font-weight:900;letter-spacing:.3px}
  .ev .sm{font-size:12px;color:var(--sub);margin-top:3px}
  .fl{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .18s}
  .fl.on{opacity:1}
  /* 게이트 활성화 시 카드 전체(경기장+스탯+경기열기)를 동일하게 흐림 */
  .card.locked .stage svg.field,.card.locked .stats,.card.locked .pulse,.card.locked .story{filter:blur(3.5px) saturate(.92) brightness(.92)}
  .card.locked .stage svg.field{transform:scale(1.03)}
  .gate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,13,22,.26);backdrop-filter:blur(1px);z-index:5;padding:14px}
  .gate.on{display:flex;animation:gfade .3s ease}
  @keyframes gfade{from{opacity:0}to{opacity:1}}
  .gbox{text-align:center;max-width:290px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .glock{font-size:30px;margin-bottom:6px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
  .gtitle{font-size:16px;font-weight:900;letter-spacing:.2px}
  .gsub{font-size:12.5px;color:var(--blue2);margin:6px 0 12px;font-weight:700}
  .gbtn{border:0;border-radius:11px;padding:11px 26px;font-size:14px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(135deg,#2b5aa0,#3d7dff);box-shadow:0 6px 18px rgba(61,125,255,.4)}
  .gbtn:active{transform:scale(.97)}
  .stats{padding:11px 14px}
  .prow{margin:8px 0}
  .plab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;font-variant-numeric:tabular-nums}
  .plab .k{color:var(--sub);font-size:11px}
  .plab .vh{color:#ffd9d6;font-weight:800}.plab .va{color:#d6e4ff;font-weight:800}
  .pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:#0a0f17}
  .pbar .bh{background:linear-gradient(90deg,#b81812,#e2231a);transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .pbar .ba{background:linear-gradient(90deg,#3d7dff,#8fb6ff);transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .pulse{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);margin-top:2px}
  .pulse .lab{font-weight:900;font-size:12.5px}
  .pulse .bar{flex:1;height:8px;border-radius:5px;background:#0a0f17;overflow:hidden}
  .pulse .bar>i{display:block;height:100%;width:20%;border-radius:5px;background:linear-gradient(90deg,#3d7dff,#f5c451,#e2231a);transition:width .6s}
  .pulse .n{font-weight:900;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
  .story{margin:0 14px 14px;background:#0e1723;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .story .h{font-size:11px;color:var(--blue2);font-weight:800;margin-bottom:3px}
  .story .t{font-size:13px}.story .t b{color:var(--gold)}
  .ctrls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
  .ctrls button{border:1px solid var(--line);background:#101826;color:var(--txt);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .ctrls button.play{background:linear-gradient(135deg,#e2231a,#ff6a3d);border:0;color:#fff;font-weight:900;padding:8px 16px}
  .foot{font-size:10.5px;color:var(--sub);text-align:center;margin:10px 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <span class="sim"><span class="dot"></span>LIVE SIMULATION</span>
      <span class="lg" id="league"></span>
    </div>
    <div class="scorebar">
      <div class="tm h"><span class="nm" id="hn"></span><span class="badge" id="hb"></span></div>
      <div class="sc"><span class="p" id="hs">0</span><span id="scsep"> : </span><span class="p" id="as">0</span></div>
      <div class="tm a"><span class="badge" id="ab"></span><span class="nm" id="an"></span></div>
    </div>
    <div class="clk">🕑 <b id="clk">0'</b> · <span id="per"></span></div>

    <div class="stage">
      <svg class="field" id="field" viewBox="0 0 400 300"></svg>
      <div class="fl" id="fl"></div>
      <div class="ev" id="ev"><div class="big" id="evB"></div><div class="sm" id="evS"></div></div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="pulse"><span class="lab">🔥 <span id="pulseLab"></span></span><div class="bar"><i id="pf"></i></div><span class="n" id="pn">15</span></div>
    <div class="story"><div class="h">🤖 <span id="storyLab"></span></div><div class="t" id="story"></div></div>
    <div class="gate" id="gate">
      <div class="gbox">
        <div class="glock">🔒</div>
        <div class="gtitle" id="gateTitle"></div>
        <div class="gsub" id="gateSub"></div>
        <button class="gbtn" id="gateBtn"></button>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

// ================= EVENT ENGINE =================
function tween(elm,x,y,ms){return new Promise(function(res){var x0=+elm.getAttribute("cx"),y0=+elm.getAttribute("cy"),t0=performance.now();function s(t){var k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);elm.setAttribute("cx",x0+(x-x0)*e);elm.setAttribute("cy",y0+(y-y0)*e);if(k<1)requestAnimationFrame(s);else res()}requestAnimationFrame(s)});}
function lightGlow(g,op,hold){if(!g)return;g.style.transition="opacity .3s";g.setAttribute("opacity",op);clearTimeout(g._t);g._t=setTimeout(function(){g.setAttribute("opacity","0")},hold);}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)});}
function setScore(hplus,aplus){if(hplus)S.hs+=hplus;if(aplus)S.as+=aplus;$("hs").textContent=S.hs;$("as").textContent=S.as;scorePop();}
function statInc(k,side){S.stat[k][side]++;renderStats();}
var busy=false,Q=[];
function enqueue(e,team){Q.push([e,team]);drain();}
async function drain(){if(busy||!Q.length)return;busy=true;var it=Q.shift();try{await run(it[0],it[1])}catch(err){}busy=false;drain();}

async function run(e,team){
  var R=(team!=="away"); var who=R?$("hn").textContent:$("an").textContent;
  var glow=R?S.glowR:S.glowL, pb=S.ball, P=S.P;
  function showBall(x,y){pb.setAttribute("opacity","1");pb.setAttribute("cx",x);pb.setAttribute("cy",y);}
  function hideBall(){pb.setAttribute("opacity","0");}
  if(sport==="soccer"){
    var goalU=R?.92:.08, midU=R?.7:.3, ctr=P(.5,.5);
    if(e==="kickoff"){lightGlow(glow,"0",0);ban(T("kickoff"),M().h+" vs "+M().a);flash("rgba(61,125,255,.4)");}
    else if(e==="shot"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.7",900);var g=P(goalU,.5);await tween(pb,g[0],g[1],460);ban(T("shot"),who);statInc("sh",R?0:1);setPulse(S.pulse+6,"<b>"+who+"</b> · "+T("shot"));await tween(pb,ctr[0],ctr[1],400);hideBall();}
    else if(e==="ontarget"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.85",1000);var g2=P(goalU,.5);await tween(pb,g2[0],g2[1],440);flash("rgba(255,255,255,.4)");ban(T("ontarget"),who);statInc("sh",R?0:1);statInc("ot",R?0:1);setPulse(S.pulse+9);await tween(pb,ctr[0],ctr[1],420);hideBall();}
    else if(e==="corner"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.6",900);var c=P(R?1:0,Math.random()<.5?.02:.98);await tween(pb,c[0],c[1],440);ban(T("corner"),who);statInc("co",R?0:1);setPulse(S.pulse+4);await tween(pb,ctr[0],ctr[1],420);hideBall();}
    else if(e==="goal"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.95",1400);var gg=P(goalU,.5);await tween(pb,gg[0],gg[1],420);flash("rgba(61,125,255,.55)");setScore(R?1:0,R?0:1);statInc("sh",R?0:1);statInc("ot",R?0:1);hideBall();ban(T("goal"),who+"  "+S.hs+" : "+S.as,true);setPulse(94,"⚽ <b>"+who+"</b> · "+T("goal")+" "+S.hs+" : "+S.as);}
    else if(e==="yellow"){flash("rgba(245,196,81,.4)");ban(T("yellow"),who);setPulse(S.pulse+2);}
    else if(e==="red"){flash("rgba(226,35,26,.45)");ban(T("red"),who);setPulse(S.pulse+6);}
    else if(e==="half"){$("field").style.filter="saturate(.45)";ban(T("half"),M().h+" "+S.hs+" : "+S.as+" "+M().a);setTimeout(function(){$("field").style.filter=""},2000);}
    else if(e==="full"){$("field").style.filter="saturate(.4) brightness(.9)";ban(T("full"),M().h+" "+S.hs+" : "+S.as+" "+M().a);}
  } else if(sport==="basket"){
    var hoop=R?S.hoopR:S.hoopL, ctr=P(.5,.5); var hx=+hoop.getAttribute("cx"),hy=+hoop.getAttribute("cy");
    if(e==="tipoff"){ban(T("tipoff"),M().h+" vs "+M().a);flash("rgba(255,150,60,.4)");}
    else if(e==="two"||e==="three"||e==="dunk"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.85",1000);await tween(pb,hx,hy,e==="dunk"?360:520);flash(e==="three"?"rgba(255,180,60,.5)":"rgba(255,150,60,.45)");var pts=e==="three"?3:2;setScore(R?pts:0,R?0:pts);statInc("fg",R?0:1);if(e==="three")statInc("tp",R?0:1);hideBall();ban(T(e),who+"  "+S.hs+" : "+S.as,e!=="two");setPulse(e==="dunk"?95:(S.pulse+10),"🏀 <b>"+who+"</b> · "+T(e)+" "+S.hs+" : "+S.as);}
    else if(e==="freethrow"){showBall(hx-40,hy);lightGlow(glow,"0.6",800);await tween(pb,hx,hy,500);setScore(R?1:0,R?0:1);hideBall();ban(T("freethrow"),who+"  "+S.hs+" : "+S.as);setPulse(S.pulse+3);}
    else if(e==="foul"){flash("rgba(245,196,81,.35)");ban(T("foul"),who);statInc("fl",R?0:1);setPulse(S.pulse+2);}
    else if(e==="timeout"){ban(T("timeout"),who);setPulse(Math.max(10,S.pulse-8));}
  } else if(sport==="volley"){
    var ctr=P(.5,.5), tgt=P(R?.85:.15,.5);
    if(e==="point"||e==="ace"||e==="spike"){showBall(ctr[0],ctr[1]);lightGlow(glow,"0.7",900);await tween(pb,tgt[0],tgt[1],460);flash("rgba(90,180,255,.45)");setScore(R?1:0,R?0:1);if(e==="ace")statInc("ac",R?0:1);if(e==="spike")statInc("at",R?0:1);hideBall();ban(T(e),who+"  "+S.hs+" : "+S.as,e==="ace");setPulse(S.pulse+ (e==="ace"?12:7),"🏐 <b>"+who+"</b> · "+T(e)+" "+S.hs+" : "+S.as);}
    else if(e==="block"){showBall(P(.5,.5)[0],P(.5,.4)[1]);lightGlow(glow,"0.6",700);flash("rgba(90,180,255,.4)");setScore(R?1:0,R?0:1);statInc("bl",R?0:1);hideBall();ban(T("block"),who+"  "+S.hs+" : "+S.as);setPulse(S.pulse+8);}
    else if(e==="setpoint"){ban(T("setpoint"),who);setPulse(90);}
    else if(e==="setover"){$("field").style.filter="saturate(.5)";ban(T("setover"),M().h+" "+S.hs+" : "+S.as+" "+M().a);setTimeout(function(){$("field").style.filter=""},1800);}
  } else if(sport==="baseball"){
    var dm=S.diamond, home=dm.home;
    if(e==="playball"){ban(T("playball"),M().h+" vs "+M().a);flash("rgba(90,180,255,.35)");}
    else if(e==="hit"){showBall(home[0],home[1]);lightGlow(S.glowR,"0.5",800);await tween(pb,dm.first[0],dm.first[1],520);flash("rgba(255,255,255,.35)");statInc("h",R?0:1);hideBall();ban(T("hit"),who);setPulse(S.pulse+7,"⚾ <b>"+who+"</b> · "+T("hit"));}
    else if(e==="homerun"){showBall(home[0],home[1]);lightGlow(S.glowR,"0.9",1900);// 큰 홈런 아치 (더 높고 길게)
      var tgtX=home[0]+(240-home[0]); // 우중간 담장쪽
      var t0=performance.now(), DUR=1500;
      await new Promise(function(res){function s(t){var k=Math.min(1,(t-t0)/DUR);
        var x=home[0]+(tgtX-home[0])*k;
        var yy=home[1]+(58-home[1])*k - 210*Math.sin(Math.PI*k); // 더 높은 포물선
        var r=6+7*Math.sin(Math.PI*k); // 날아오르며 커졌다 작아짐
        pb.setAttribute("cx",x);pb.setAttribute("cy",yy);pb.setAttribute("r",r.toFixed(1));
        if(k<1)requestAnimationFrame(s);else res();}requestAnimationFrame(s)});
      pb.setAttribute("r","6");
      flash("rgba(245,196,81,.6)");setTimeout(function(){flash("rgba(255,255,255,.4)");},180);
      setScore(R?1:0,R?0:1);statInc("h",R?0:1);statInc("r",R?0:1);hideBall();ban("💥 "+T("homerun"),who+"  "+S.hs+" : "+S.as,true);setPulse(97,"⚾ <b>"+who+"</b> · "+T("homerun")+" "+S.hs+" : "+S.as);}
    else if(e==="run"){showBall(dm.third[0],dm.third[1]);lightGlow(S.glowR,"0.5",700);await tween(pb,dm.home[0],dm.home[1],520);flash("rgba(90,180,255,.4)");setScore(R?1:0,R?0:1);statInc("r",R?0:1);hideBall();ban(T("run"),who+"  "+S.hs+" : "+S.as);setPulse(S.pulse+8);}
    else if(e==="strikeout"){flash("rgba(226,35,26,.3)");ban(T("strikeout"),who);statInc("so",R?0:1);setPulse(S.pulse+4);}
    else if(e==="out"){ban(T("out"),who);setPulse(Math.max(10,S.pulse-3));}
  }
}

// ================= UI / RENDER =================
function M(){return MATCHES[sport];}
function renderStats(){
  var box=$("stats");box.innerHTML="";
  SPORTS[sport].stats.forEach(function(st){
    var k=st[0],h=S.stat[k][0],a=S.stat[k][1],tot=h+a||1;
    var suffix=(sport==="soccer"&&k==="pos")?"%":"";
    var row=document.createElement("div");row.className="prow";
    row.innerHTML='<div class="plab"><span class="vh">'+h+suffix+'</span><span class="k">'+T(st[1])+'</span><span class="va">'+a+suffix+'</span></div><div class="pbar"><i class="bh" style="width:'+(h/tot*100)+'%"></i><i class="ba" style="width:'+(a/tot*100)+'%"></i></div>';
    box.appendChild(row);
  });
}
function periodLabel(){
  if(sport==="soccer")return T(S.half2?"per_soccer2":"per_soccer");
  if(sport==="basket")return "3"+T("q");
  if(sport==="volley")return T("set")+" 2";
  if(sport==="baseball")return "5 "+T("inning");
  return "";
}
function initState(){
  // 들어온 시점의 "현재 스코어"로 라이브 상태를 세팅 (처음부터 재생 아님)
  var sd=M().seed||{};
  S.hs=sd.hs||0;S.as=sd.as||0;S.pulse=45;S.half2=false;S.stat={};
  SPORTS[sport].stats.forEach(function(st){S.stat[st[0]]= (sd.stat&&sd.stat[st[0]]) ? sd.stat[st[0]].slice() : [0,0]});
  if(sport==="soccer"){S.stat.pos=[52,48];}
  $("hs").textContent=S.hs;$("as").textContent=S.as;
}
function loadSport(){
  var m=M();
  $("hn").textContent=m.h;$("an").textContent=m.a;$("hb").textContent=m.hb;$("ab").textContent=m.ab;$("league").textContent=m.lg;
  initState();
  ({soccer:drawSoccer,basket:drawBasket,volley:drawVolley,baseball:drawBaseball})[sport]();
  renderStats();
  $("clk").textContent = sport==="baseball" ? "5"+T("inning") : (sport==="volley" ? T("set")+" 2" : (sport==="basket"?"03:20":"46'"));
  $("per").textContent=periodLabel();
  // 들어온 시점 = 라이브 상태. 현재 스코어를 그대로 보여주며 대기 (처음부터 재생 아님)
  setPulse(45,"🔴 LIVE · "+m.h+" "+S.hs+" : "+S.as+" "+m.a);
  buildCtrls();
  armGate();
}
function buildCtrls(){ /* 실데이터 연동 버전: 수동 컨트롤 없음 */ }
function buildSportTabs(){
  var t=$("sportTabs");t.innerHTML="";
  Object.keys(SPORTS).forEach(function(sp){var b=document.createElement("button");b.textContent=SPORTS[sp].icon+" "+({soccer:"축구",basket:"농구",volley:"배구",baseball:"야구"})[sp];b.className=(sp===sport?"on":"");b.onclick=function(){sport=sp;buildSportTabs();loadSport();};t.appendChild(b);});
}
// 라이브 데모: 현재 스코어에서 "새로 들어오는 이벤트"만 이어서 재생 (리셋 없음)
function autoPlay(){
  var seqs={
    soccer:["shot","corner","goal","ontarget","yellow","goal"],
    basket:["two","three","foul","dunk","two","three"],
    volley:["point","ace","spike","block","point","spike"],
    baseball:["hit","run","strikeout","homerun","hit","out"]
  };
  var seq=seqs[sport],i=0;
  (function next(){ if(i>=seq.length)return; enqueue(seq[i], i%3===2?"away":"home"); i++; setTimeout(next, 2600); })();
}

// language + match selectors
function buildLangSel(){var s=$("langSel");s.innerHTML="";LANGS.forEach(function(l){var o=document.createElement("option");o.value=l;o.textContent=LANGNAME[l];if(l===LANG)o.selected=true;s.appendChild(o);});s.onchange=function(){LANG=s.value;applyStatic();loadSport();};}
function applyStatic(){$("pulseLab").textContent=T("pulse");$("storyLab").textContent=T("story");$("story").textContent="";$("foot").textContent=T("note")+" · LIVE UP";
  $("gateTitle").textContent=T("gateTitle");$("gateSub").textContent=T("gateSub");$("gateBtn").textContent=T("gateBtn");}
// ===== 로그인 게이트: 10초 시청 후 흐림 + 로그인 안내 =====
function isLogged(){try{return !!(localStorage.getItem("liveup_token")||localStorage.getItem("liveup_user"))}catch(e){return false}}
var gateTimer=null;
function armGate(){
  clearTimeout(gateTimer);
  var card=document.querySelector(".card");
  card.classList.remove("locked");$("gate").classList.remove("on");
  if(isLogged())return; // 로그인 상태면 게이트 없음
  gateTimer=setTimeout(function(){
    card.classList.add("locked");$("gate").classList.add("on");
    Q.length=0; // 대기중 이벤트 중지
  },10000);
}
$("gateBtn").onclick=function(){
  // 실제 앱: 부모창에 로그인 요청(postMessage). 데모: 계속 보기
  try{ if(window.parent&&window.parent!==window){window.parent.postMessage({liveupSim:"login"},"*");return;} }catch(e){}
  var card=document.querySelector(".card");
  card.classList.remove("locked");$("gate").classList.remove("on");
  armGate();
};

// ===================== LIVE UP SHORTS — 자동 하이라이트 릴 (재생버튼 없음, 반복) =====================
function qp(k){try{return new URLSearchParams(location.search).get(k);}catch(e){return null;}}
var _plang=qp("lang"); if(_plang&&LANGS.indexOf(_plang)>=0)LANG=_plang; else{try{var ll=localStorage.getItem("liveup_lang_user")||localStorage.getItem("liveup_lang");if(ll&&LANGS.indexOf(ll)>=0)LANG=ll;}catch(e){}}
armGate=function(){};  // 숏츠엔 로그인 게이트 없음
// 스탯/펄스/스토리 패널 숨겨서 영상처럼 (경기장 위주)
var hideCss=document.createElement("style");hideCss.textContent=".stats,.pulse,.story{display:none!important}.card{border:0;box-shadow:none;background:#0a0e15}.stage{border-radius:14px}#shBadge{position:absolute;left:10px;top:8px;z-index:6;display:flex;align-items:center;gap:5px;font-weight:900;font-size:11px;letter-spacing:.3px;background:linear-gradient(135deg,#e2231a,#ff6a3d);color:#fff;padding:4px 9px;border-radius:20px;box-shadow:0 3px 10px rgba(226,35,26,.4)}#shBadge .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blip 1.2s infinite}#shBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:6}#shBar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5c451,#e2231a);transition:width .2s linear}";
document.head.appendChild(hideCss);
// 배지 + 진행바 오버레이
var stage=document.querySelector(".stage");
var badge=document.createElement("div");badge.id="shBadge";badge.innerHTML='<span class="dot"></span>⚡ LIVE UP SHORTS';stage.appendChild(badge);
var bar=document.createElement("div");bar.id="shBar";bar.innerHTML='<i></i>';stage.appendChild(bar);var barI=bar.querySelector("i");
// 스탯 게이지 오버레이(중간중간 점유율/슈팅 게이지 차오르는 연출)
var gg=document.createElement("div");gg.id="shGauge";gg.innerHTML='<div class="gg-row"><span class="gg-l" id="ggL">0</span><span class="gg-k" id="ggK">-</span><span class="gg-r" id="ggR">0</span></div><div class="gg-bar"><i class="gg-h" id="ggH"></i><i class="gg-a" id="ggA"></i></div>';stage.appendChild(gg);
var ggCss=document.createElement("style");ggCss.textContent="#shGauge{position:absolute;left:10px;right:10px;bottom:12px;z-index:6;background:rgba(6,11,20,.55);border:1px solid rgba(140,180,255,.22);border-radius:10px;padding:7px 10px;backdrop-filter:blur(3px);opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}#shGauge.on{opacity:1;transform:none}#shGauge .gg-row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}#shGauge .gg-l{color:#ffd9d6}#shGauge .gg-r{color:#d6e4ff}#shGauge .gg-k{color:#9fb2c8;font-size:10.5px}#shGauge .gg-bar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:#0a0f17;margin-top:4px}#shGauge .gg-h{background:linear-gradient(90deg,#b81812,#e2231a);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}#shGauge .gg-a{background:linear-gradient(90deg,#3d7dff,#8fb6ff);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}";document.head.appendChild(ggCss);
function gk(key,fb){try{var v=T(key);return (v&&v!==key)?v:fb;}catch(e){return fb;}}
function showGauge(kind){
  var pairs={
    pos:{k:gk("st_pos","점유율"),h:44+Math.floor(Math.random()*20),pct:true},
    sh :{k:gk("st_sh","슈팅"), h:7+Math.floor(Math.random()*9), a:4+Math.floor(Math.random()*7)},
    at :{k:gk("st_at","공격"), h:9+Math.floor(Math.random()*11),a:6+Math.floor(Math.random()*9)},
    h  :{k:gk("st_h","안타"),  h:5+Math.floor(Math.random()*7), a:3+Math.floor(Math.random()*6)},
    fg :{k:gk("st_fg","야투"), h:18+Math.floor(Math.random()*12),a:15+Math.floor(Math.random()*10)}
  };
  var d=pairs[kind]||pairs.sh, hv,av;
  if(d.pct){hv=d.h;av=100-d.h;} else {hv=d.h;av=d.a;}
  $("ggK").textContent=d.k;
  $("ggL").textContent=d.pct?hv+"%":hv; $("ggR").textContent=d.pct?av+"%":av;
  $("ggH").style.width="50%";$("ggA").style.width="50%"; // 리셋 후 차오름
  gg.classList.add("on");
  setTimeout(function(){var t=hv+av||1;$("ggH").style.width=(hv/t*100)+"%";$("ggA").style.width=(av/t*100)+"%";},60);
  clearTimeout(gg._t);gg._t=setTimeout(function(){gg.classList.remove("on");},2600);
}
applyStatic();
// 하이라이트 순서: 축구 골 → 야구 홈런 → 배구 스파이크 → 농구 덩크 → 축구 옐로 → 축구 레드 (반복)
var REEL=[
  {sp:"soccer",   ev:"goal",    side:"home", g:"pos"},
  {sp:"baseball", ev:"homerun", side:"home", g:"h"},
  {sp:"volley",   ev:"spike",   side:"away", g:"at"},
  {sp:"basket",   ev:"dunk",    side:"home", g:"fg"},
  {sp:"soccer",   ev:"yellow",  side:"away", g:"sh"},
  {sp:"soccer",   ev:"red",     side:"home", g:"pos"}
];
var CLIP=3000, ri=0, t0=0;
function clip(){
  var c=REEL[ri%REEL.length]; ri++;
  sport=c.sp; Q.length=0;
  loadSport();            // 종목별 경기장 그리기 + 현재 스코어
  setPulse(62);
  setTimeout(function(){ enqueue(c.ev, c.side); }, 700);  // 하이라이트 연출
  if(c.g) setTimeout(function(){ showGauge(c.g); }, 1400); // 중간 스탯 게이지 연출
  t0=Date.now();
  setTimeout(clip, CLIP);
}
// 진행바 애니메이션
setInterval(function(){ if(!t0)return; var p=Math.min(1,(Date.now()-t0)/CLIP); barI.style.width=(p*100).toFixed(1)+"%"; },100);
clip();
})();
</script>
