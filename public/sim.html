<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>LIVE UP · LIVE SIMULATION v2 (미리보기)</title>
<style>
  :root{
    --bg:#0a0e15; --card:#121a26; --card2:#0f1620; --line:#243044;
    --home:#e2231a; --away:#ffffff; --awayEdge:#3d7dff; --gold:#f5c451; --txt:#eef3fa; --sub:#8592a5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
  body{background:radial-gradient(130% 100% at 50% -10%, #14202f, #0a0e15 60%); color:var(--txt);
    font-family:-apple-system,"Apple SD Gothic Neo",Roboto,"Malgun Gothic",sans-serif; padding:14px; line-height:1.4}
  .wrap{max-width:440px; margin:0 auto}
  h2.sec{font-size:12px; letter-spacing:1px; color:var(--sub); text-transform:uppercase; margin:20px 4px 8px; font-weight:800}
  .card{position:relative; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 10px 34px rgba(0,0,0,.4)}
  /* 로그인 게이트 (10초 후 카드 전체 흐림) */
  .card.locked .stage,.card.locked .stats,.card.locked .pulse,.card.locked .story{filter:blur(3.5px) saturate(.92) brightness(.92)}
  .gate{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,13,22,.26); backdrop-filter:blur(1px); z-index:9; padding:14px}
  .gate.on{display:flex; animation:gfade .3s ease}
  @keyframes gfade{from{opacity:0}to{opacity:1}}
  .gbox{text-align:center; max-width:290px; text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .glock{font-size:30px; margin-bottom:6px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
  .gtitle{font-size:16px; font-weight:900}
  .gsub{font-size:12.5px; color:var(--blue2,#8fd0ff); margin:6px 0 12px; font-weight:700}
  .gbtn{border:0; border-radius:11px; padding:11px 26px; font-size:14px; font-weight:900; color:#fff; cursor:pointer; background:linear-gradient(135deg,#2b5aa0,#3d7dff); box-shadow:0 6px 18px rgba(61,125,255,.4)}
  .gbtn:active{transform:scale(.97)}

  /* header */
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px}
  .sim{display:inline-flex; align-items:center; gap:7px; font-weight:900; font-size:13px; letter-spacing:.4px}
  .sim .dot{width:8px;height:8px;border-radius:50%;background:#ff453a;box-shadow:0 0 0 0 rgba(255,69,58,.6);animation:blip 1.3s infinite}
  @keyframes blip{70%{box-shadow:0 0 0 7px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
  .realbadge{font-size:10px; font-weight:800; color:#7ee6a5; background:rgba(126,230,165,.12); border:1px solid rgba(126,230,165,.3); padding:3px 8px; border-radius:20px}
  .scorebar{display:flex; align-items:center; justify-content:center; gap:14px; padding:2px 14px 4px}
  .tm{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; flex:1}
  .tm.h{justify-content:flex-end; text-align:right}
  .tm .badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}
  .tm.h .badge{background:var(--home);color:#fff}
  .tm.a .badge{background:#fff;color:#123;border:2px solid var(--awayEdge)}
  .sc{font-weight:900; font-size:24px; letter-spacing:2px; font-variant-numeric:tabular-nums}
  .clk{text-align:center; color:var(--sub); font-size:11.5px; padding-bottom:8px; font-variant-numeric:tabular-nums}
  .clk b{color:var(--gold)}

  /* pitch */
  .stage{position:relative; background:#0c1119}
  svg{display:block; width:100%; height:auto}
  .ev{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) scale(.85); opacity:0;
    background:rgba(5,12,25,.82); border:1px solid rgba(140,180,255,.28); border-radius:14px; padding:11px 16px; text-align:center;
    pointer-events:none; transition:opacity .28s cubic-bezier(.2,.8,.2,1), transform .28s cubic-bezier(.2,.8,.2,1); min-width:160px; backdrop-filter:blur(4px)}
  .ev.on{opacity:1; transform:translate(-50%,-50%) scale(1)}
  .ev .big{font-size:20px; font-weight:900; letter-spacing:.3px}
  .ev .sm{font-size:12px; color:var(--sub); margin-top:3px}
  .ev.goal{border-color:var(--gold); box-shadow:0 0 34px rgba(245,196,81,.45)}
  .ev.goal .big{color:var(--gold); font-size:28px}
  .fl{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .18s; background:radial-gradient(circle at 50% 22%, rgba(245,196,81,.5), transparent 62%)}
  .fl.on{opacity:1}

  /* ===== event video overlay (실제 영상 클립) ===== */
  .evvid{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:transparent; opacity:0; transition:opacity .22s; z-index:8; pointer-events:none}
  .evvid.on{opacity:1}

  /* ===== kickoff pulse / light sweep / score pop / desat ===== */
  #koPulse,#koPulse2{transform-box:fill-box; transform-origin:center}
  #koPulse.go{animation:koP 1.1s ease-out} #koPulse2.go{animation:koP 1.1s .18s ease-out}
  @keyframes koP{0%{opacity:.9; transform:scale(.4)}100%{opacity:0; transform:scale(3.4)}}
  #lightSweep{animation:pSweep 11s linear infinite}
  @keyframes pSweep{0%{transform:translateX(0); opacity:0}4%{opacity:.6}13%{opacity:.6}17%{opacity:0; transform:translateX(520px)}100%{opacity:0; transform:translateX(520px)}}
  .sc .pop{display:inline-block; animation:scoreP .55s cubic-bezier(.22,1,.36,1)}
  @keyframes scoreP{0%{transform:scale(.85); color:#8fd0ff}45%{transform:scale(1.18); color:#8fd0ff; text-shadow:0 0 14px rgba(61,125,255,.9)}100%{transform:scale(1); text-shadow:none}}
  #pitch{transition:filter .8s}
  #pitch.desat{filter:saturate(.4) brightness(.92)}

  /* ===== code-drawn CARD animation (옐로/레드) ===== */
  .cardfx{position:absolute; inset:0; z-index:9; opacity:0; pointer-events:none; display:grid; place-items:center; overflow:hidden; perspective:900px}
  .cardfx.on{opacity:1; transition:opacity .18s}
  .cardfx .dim{position:absolute; inset:0; background:rgba(4,8,14,.6); opacity:0}
  .cardfx.on .dim{opacity:1; transition:opacity .2s}
  .cardfx .edge{position:absolute; inset:0; box-shadow:inset 0 0 70px 24px var(--cc,#f5c451); opacity:0}
  .cardfx.go .edge{animation:c_edge .9s ease-out}
  @keyframes c_edge{0%{opacity:.55}100%{opacity:0}}
  .cardfx .pulse2{position:absolute; width:130px; height:130px; border-radius:50%; background:radial-gradient(circle, var(--cc,#f5c451), transparent 68%); opacity:0; transform:scale(.3)}
  .cardfx.go .pulse2{animation:c_pulse 1s .1s ease-out}
  @keyframes c_pulse{0%{opacity:.85; transform:scale(.3)}100%{opacity:0; transform:scale(4.2)}}
  .cardfx .rays{position:absolute; width:340px; height:340px; opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0deg 6deg, transparent 6deg 16deg)}
  .cardfx.go .rays{animation:c_rays 1.4s .1s ease-out}
  @keyframes c_rays{0%{opacity:0; transform:scale(.4) rotate(0)}30%{opacity:.5}100%{opacity:0; transform:scale(1.5) rotate(40deg)}}
  .thecard{position:relative; width:118px; height:168px; border-radius:14px; opacity:0; transform-style:preserve-3d;
    transform:translate(-150%,120%) rotateZ(-42deg) rotateY(65deg) scale(.8);
    box-shadow: 7px 0 0 rgba(0,0,0,.28), 8px 2px 0 rgba(0,0,0,.22), 0 24px 55px rgba(0,0,0,.6),
      inset 0 3px 6px rgba(255,255,255,.55), inset 0 -8px 14px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.18)}
  .card-y{background:linear-gradient(135deg,#fff0a8 0%,#ffd94f 28%,#f5c451 55%,#d99518 100%)}
  .card-r{background:linear-gradient(135deg,#ff9182 0%,#f5403a 30%,#e2231a 58%,#9d0d06 100%)}
  .cardfx.go .thecard{animation:c_in 2.2s cubic-bezier(.18,.9,.2,1) forwards}
  @keyframes c_in{
    0%{transform:translate(-150%,120%) rotateZ(-42deg) rotateY(65deg) scale(.8); opacity:0}
    22%{opacity:1}
    44%{transform:translate(0,0) rotateZ(7deg) rotateY(-16deg) rotateX(6deg) scale(1.16)}
    60%{transform:translate(0,0) rotateZ(-3deg) rotateY(9deg) rotateX(-2deg) scale(1)}
    84%{transform:translate(0,-2%) rotateZ(0) rotateY(-3deg) rotateX(0) scale(1); opacity:1}
    100%{transform:translate(0,-22%) rotateZ(0) rotateY(0) scale(.95); opacity:0}}
  .thecard .shine{position:absolute; inset:0; border-radius:14px; overflow:hidden}
  .thecard .shine:before{content:""; position:absolute; top:-50%; left:-70%; width:42%; height:200%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); transform:rotate(16deg)}
  .cardfx.go .thecard .shine:before{animation:c_sweep 1.2s .6s ease-in-out}
  @keyframes c_sweep{0%{left:-70%}100%{left:155%}}
  .thecard .gloss{position:absolute; inset:0; border-radius:14px; background:linear-gradient(150deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.08) 30%, transparent 55%)}
  .cparts{position:absolute; inset:0; overflow:hidden}
  .cparts i{position:absolute; bottom:-12px; width:6px; height:6px; border-radius:50%; opacity:.9; animation:c_rise linear forwards}
  @keyframes c_rise{0%{transform:translateY(0) scale(1); opacity:.9}100%{transform:translateY(-320px) scale(.4); opacity:0}}

  /* ===== goal cinematic (side-angle net scene) ===== */
  .gscene{position:absolute; inset:0; opacity:0; pointer-events:none; display:grid; place-items:center; z-index:6; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 35%, #16324a, #060b12 78%); transition:opacity .3s}
  .gscene.on{opacity:1}
  .gscene.shake{animation:gshake .6s}
  @keyframes gshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,4px)}35%{transform:translate(6px,-4px)}55%{transform:translate(-4px,3px)}75%{transform:translate(4px,-2px)}}
  .gsvg{position:absolute; inset:0; width:100%; height:100%; transform-origin:60% 55%}
  .gsvg.push{animation:campush .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes campush{0%{transform:scale(1)}28%{transform:scale(1.09)}100%{transform:scale(1.03)}}
  #impact{opacity:0; transform-box:fill-box; transform-origin:center}
  #impact.pop{animation:impactpop .62s cubic-bezier(.2,1.5,.3,1) forwards}
  @keyframes impactpop{0%{opacity:0; transform:scale(.35)}45%{opacity:1; transform:scale(1.16)}100%{opacity:1; transform:scale(1)}}
  #netMesh{transform-box:fill-box; transform-origin:center}
  #netMesh.bulge{animation:netbulge .7s cubic-bezier(.2,.9,.2,1)}
  @keyframes netbulge{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}
  #burst.go{animation:burstA .85s ease-out}
  @keyframes burstA{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
  #speed.go{animation:spd .42s ease-in}
  @keyframes spd{0%{opacity:0; transform:translateX(-34px)}45%{opacity:1}100%{opacity:0; transform:translateX(80px)}}
  .shock{position:absolute; left:58%; top:44%; width:22px; height:22px; border-radius:50%; border:3px solid #fff; transform:translate(-50%,-50%) scale(0); opacity:0}
  .shock.go{animation:shockexp .65s ease-out}
  @keyframes shockexp{0%{transform:translate(-50%,-50%) scale(0);opacity:.9}100%{transform:translate(-50%,-50%) scale(11);opacity:0}}
  .gtext{position:absolute; top:16px; left:0; right:0; z-index:4; text-align:center}
  .gword{font-size:52px; font-weight:900; color:#f5c451; letter-spacing:3px; text-shadow:0 6px 26px rgba(0,0,0,.65); transform:scale(.3); opacity:0}
  .gword.go{animation:gpop .65s cubic-bezier(.2,1.6,.3,1) forwards}
  @keyframes gpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .gwho{color:#fff; font-weight:800; font-size:15px; margin-top:4px; opacity:0}
  .gwho.go{animation:gfade .4s .3s forwards}
  @keyframes gfade{to{opacity:1}}
  .gflash{position:absolute; inset:0; background:#fff; opacity:0; z-index:3}
  .gflash.go{animation:gfl .5s}
  @keyframes gfl{0%{opacity:.92}100%{opacity:0}}
  .confetti{position:absolute; inset:0; overflow:hidden; z-index:1}
  .confetti i{position:absolute; top:-12px; width:7px; height:11px; border-radius:1px; opacity:.95; animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(360px) rotate(560deg); opacity:0}}

  /* live stat panel */
  .stats{padding:12px 14px}
  .prow{margin:9px 0}
  .plabels{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; font-variant-numeric:tabular-nums}
  .plabels .k{color:var(--sub); font-size:11px}
  .plabels .vh{color:#ffd9d6; font-weight:800} .plabels .va{color:#d6e4ff; font-weight:800}
  .pbar{display:flex; height:7px; border-radius:5px; overflow:hidden; background:#0a0f17}
  .pbar .bh{background:linear-gradient(90deg,#b81812,#e2231a); transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .pbar .ba{background:linear-gradient(90deg,#3d7dff,#8fb6ff); transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .pulse{display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--line); margin-top:4px}
  .pulse .lab{font-weight:900; font-size:13px}
  .pulse .bar{flex:1; height:8px; border-radius:5px; background:#0a0f17; overflow:hidden}
  .pulse .bar>i{display:block;height:100%;width:20%;border-radius:5px;background:linear-gradient(90deg,#3d7dff,#f5c451,#e2231a);transition:width .6s}
  .pulse .n{font-weight:900; font-size:18px; color:var(--gold); font-variant-numeric:tabular-nums}

  /* story */
  .story{margin:0 14px 14px; background:#0e1723; border:1px solid var(--line); border-radius:12px; padding:10px 12px}
  .story .h{font-size:11px; color:#9fd3ff; font-weight:800; margin-bottom:3px}
  .story .t{font-size:13px} .story .t b{color:var(--gold)}

  .foot{font-size:11px; color:var(--sub); text-align:center; margin:10px 4px}
  .ctrls{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:10px 0}
  .ctrls button{border:1px solid var(--line); background:#101826; color:var(--txt); border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer}
  .ctrls button.play{background:linear-gradient(135deg,#e2231a,#ff6a3d); border:0; color:#fff; font-weight:900; padding:9px 18px}

  /* real event proof list */
  .proof{margin:6px 14px 14px; font-size:12px}
  .proof .r{display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); color:var(--sub)}
  .proof .r:last-child{border:0}
  .proof .m{color:var(--gold); font-weight:800; width:34px}
  .proof b{color:var(--txt)}

  /* ===== icon chooser ===== */
  .mock{background:#0f1620; border:1px solid var(--line); border-radius:14px; padding:0; overflow:hidden; margin-bottom:10px}
  .mrow{display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line)}
  .mrow:last-child{border:0}
  .mtime{font-size:11px; color:var(--sub); width:34px; text-align:center; flex:none}
  .mteams{flex:1; min-width:0}
  .mteams .l{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mteams .l .s{color:var(--gold); font-weight:900; margin:0 4px}
  .mlive{font-size:9px; font-weight:900; color:#ff453a; border:1px solid rgba(255,69,58,.4); border-radius:5px; padding:1px 4px; margin-left:4px}
  .mact{display:flex; align-items:center; gap:8px; flex:none}
  .bell{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#182234;font-size:15px;color:#c8d3e2}
  /* candidate entry buttons */
  .opt{cursor:pointer; user-select:none}
  .o-pitch{width:34px;height:30px;border-radius:8px;position:relative;background:linear-gradient(180deg,#1f7a43,#155e33);display:grid;place-items:center;overflow:hidden;border:1px solid #2a5}
  .o-pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.4)}
  .o-pitch .pk{width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
  .o-2d{height:30px;padding:0 9px;border-radius:8px;display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#e2231a,#ff6a3d);color:#fff;font-weight:900;font-size:11px;box-shadow:0 0 12px rgba(226,35,26,.5)}
  .o-2d .bd{width:6px;height:6px;border-radius:50%;background:#fff;animation:blip2 1.1s infinite}
  @keyframes blip2{0%,100%{opacity:1}50%{opacity:.3}}
  .o-ball{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#182234;font-size:15px;position:relative}
  .o-ball .mv{position:absolute;font-size:15px;animation:roll 1.4s linear infinite}
  @keyframes roll{0%{transform:translateX(-7px) rotate(0)}100%{transform:translateX(7px) rotate(360deg)}}
  .o-radar{width:30px;height:30px;border-radius:9px;background:#0d2038;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #1c4}
  .o-radar:before{content:"";position:absolute;width:200%;height:200%;background:conic-gradient(from 0deg,rgba(60,255,150,.5),transparent 25%);animation:spin 2s linear infinite}
  .o-radar .c{width:5px;height:5px;border-radius:50%;background:#3dff96;z-index:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .o-pill{height:30px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:5px;background:#182234;border:1px solid #2b3a52;color:#cfe0ff;font-weight:800;font-size:11px}
  .o-pill .run{animation:run 1.2s ease-in-out infinite}
  @keyframes run{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
  .optname{font-size:10.5px;color:var(--sub);text-align:center;margin-top:3px}
  .optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
  .optcell{background:#0e1723;border:1px solid var(--line);border-radius:12px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .note{font-size:11px;color:var(--sub);text-align:center;margin:8px 6px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="hdr">
      <span class="sim"><span class="dot"></span>LIVE SIMULATION</span>
      <span class="realbadge" id="realbadge">● LIVE</span>
    </div>
    <div class="scorebar">
      <div class="tm h"><span id="hn">-</span><span class="badge" id="hb">-</span></div>
      <div class="sc"><span id="hs">0</span> : <span id="as">0</span></div>
      <div class="tm a"><span class="badge" id="ab">-</span><span id="an">-</span></div>
    </div>
    <div class="clk">🕑 <b id="clk">0'</b> · <span id="per">-</span> · <span id="league">-</span></div>

    <div class="stage">
      <svg id="pitch" viewBox="0 0 400 340">
        <defs>
          <linearGradient id="standg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16222f"/><stop offset="1" stop-color="#0c1622"/></linearGradient>
          <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#176535"/><stop offset="0.5" stop-color="#1c7a41"/><stop offset="1" stop-color="#249149"/></linearGradient>
          <radialGradient id="flood" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(226,238,255,.7)"/><stop offset="100%" stop-color="rgba(226,238,255,0)"/></radialGradient>
          <radialGradient id="vign" cx="50%" cy="58%" r="62%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,.5)"/></radialGradient>
          <radialGradient id="atkR" cx="80%" cy="50%" r="60%"><stop offset="0" stop-color="rgba(90,240,140,.7)"/><stop offset="72%" stop-color="rgba(74,222,128,0)"/></radialGradient>
          <radialGradient id="atkL" cx="20%" cy="50%" r="60%"><stop offset="0" stop-color="rgba(90,240,140,.7)"/><stop offset="72%" stop-color="rgba(74,222,128,0)"/></radialGradient>
          <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,0)"/><stop offset="0.5" stop-color="rgba(255,255,255,.09)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>
        </defs>
        <rect width="400" height="340" fill="#0a1420"/>
        <rect width="400" height="80" fill="url(#standg)"/>
        <ellipse cx="80" cy="8" rx="70" ry="34" fill="url(#flood)" opacity=".5"/>
        <ellipse cx="200" cy="4" rx="70" ry="34" fill="url(#flood)" opacity=".45"/>
        <ellipse cx="320" cy="8" rx="70" ry="34" fill="url(#flood)" opacity=".5"/>
        <g id="crowd2"></g>
        <g id="ledboard"></g>
        <g id="pitchG"></g>
        <rect id="lightSweep" x="-70" y="88" width="80" height="250" fill="url(#sweepG)" opacity="0"/>
        <path id="glowL" d="" fill="url(#atkL)" opacity="0"/>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg", $=function(i){return document.getElementById(i)};

  function mk(tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);return e;}

  function liveupText(p,cx,cy,size){var t=mk("text",{x:cx,y:cy,"text-anchor":"middle","font-family":"Arial,Helvetica,sans-serif","font-weight":"900","font-size":size,"letter-spacing":"0.5"});var a=mk("tspan",{fill:"#f5c451"});a.textContent="LIVE ";t.appendChild(a);var b=mk("tspan",{fill:"#8fd0ff"});b.textContent="UP";t.appendChild(b);p.appendChild(t);return t;}
  // ---- 3D 원근 경기장 + 어택 존 ----

  function buildPitch(){

    // 상단 전광판 (LIVE UP 로고)
    cr.appendChild(mk("rect",{x:152,y:6,width:96,height:36,rx:4,fill:"#0a141f",stroke:"#2b3d55","stroke-width":1}));
    cr.appendChild(mk("rect",{x:156,y:10,width:88,height:20,rx:2,fill:"#0d1a2a"}));
    liveupText(cr,200,25,13);
    txt(cr,{x:200,y:37,"text-anchor":"middle","font-family":"Arial,sans-serif","font-size":"5.5",fill:"#9fb3c8"},"More Than a Score");
    // LED 광고판 (LIVE UP 반복)
    var lb=$("ledboard");
    lb.appendChild(mk("rect",{x:0,y:74,width:400,height:15,fill:"#0f2c52"}));
    lb.appendChild(mk("rect",{x:0,y:74,width:400,height:2,fill:"rgba(255,255,255,.18)"}));
    lb.appendChild(mk("rect",{x:0,y:87,width:400,height:2,fill:"rgba(0,0,0,.35)"}));

    var pg=$("pitchG");
    pg.appendChild(mk("polygon",{points:ptStr([P(0,0),P(1,0),P(1,1),P(0,1)]),fill:"url(#grassG)"}));
    for(var s=0;s<8;s++){pg.appendChild(mk("polygon",{points:ptStr([P(s/8,0),P((s+1)/8,0),P((s+1)/8,1),P(s/8,1)]),fill:(s%2?"rgba(255,255,255,.055)":"rgba(0,0,0,.05)")}));}
    // 잔디 워터마크 (은은하게)
    var wm=P(0.5,0.62); txt(pg,{x:200,y:wm[1].toFixed(1),"text-anchor":"middle","font-family":"Arial,sans-serif","font-weight":"900","font-size":"20","letter-spacing":"2",fill:"rgba(255,255,255,.10)"},"LIVE UP");
    $("glowR").setAttribute("d",pathD([P(0.5,0),P(1,0),P(1,1),P(0.5,1)]));
    $("glowL").setAttribute("d",pathD([P(0.5,0),P(0,0),P(0,1),P(0.5,1)]));
    var pl=$("pitchLines");
    function ln(a,b,w){pl.appendChild(mk("line",{x1:a[0].toFixed(1),y1:a[1].toFixed(1),x2:b[0].toFixed(1),y2:b[1].toFixed(1),stroke:"rgba(255,255,255,.78)","stroke-width":w||1.4}));}
    function poly(a,w){pl.appendChild(mk("polygon",{points:ptStr(a),fill:"none",stroke:"rgba(255,255,255,.78)","stroke-width":w||1.4}));}
    pl.appendChild(mk("polygon",{id:"boxL",points:ptStr([P(0,0.3),P(0.15,0.34),P(0.15,0.66),P(0,0.7)]),fill:"#f5c451",opacity:0}));
    pl.appendChild(mk("polygon",{id:"boxR",points:ptStr([P(1,0.3),P(0.85,0.34),P(0.85,0.66),P(1,0.7)]),fill:"#f5c451",opacity:0}));
    poly([P(0,0),P(1,0),P(1,1),P(0,1)],1.6);
    ln(P(0.5,0),P(0.5,1));
    pl.appendChild(mk("ellipse",{cx:200,cy:P(0.5,0.5)[1].toFixed(1),rx:38,ry:13,fill:"none",stroke:"rgba(255,255,255,.78)","stroke-width":1.4}));
    poly([P(0,0.3),P(0.15,0.34),P(0.15,0.66),P(0,0.7)]);
    poly([P(1,0.3),P(0.85,0.34),P(0.85,0.66),P(1,0.7)]);
    function drawGoal(u){
      var out=(u===0?-1:1), a=P(u,0.43), b=P(u,0.57), dx=14*out;
      var ba=[a[0]+dx,a[1]-3], bb=[b[0]+dx,b[1]+3];
      pl.appendChild(mk("polygon",{points:ptStr([a,ba,bb,b]),fill:"rgba(255,255,255,.10)"}));
      for(var k=1;k<4;k++){var t=k/4;pl.appendChild(mk("line",{x1:(a[0]+(b[0]-a[0])*t).toFixed(1),y1:(a[1]+(b[1]-a[1])*t).toFixed(1),x2:(ba[0]+(bb[0]-ba[0])*t).toFixed(1),y2:(ba[1]+(bb[1]-ba[1])*t).toFixed(1),stroke:"rgba(255,255,255,.45)","stroke-width":0.8}));}
      for(var k=1;k<3;k++){var t=k/3;pl.appendChild(mk("line",{x1:(a[0]+(ba[0]-a[0])*t).toFixed(1),y1:(a[1]+(ba[1]-a[1])*t).toFixed(1),x2:(b[0]+(bb[0]-b[0])*t).toFixed(1),y2:(b[1]+(bb[1]-b[1])*t).toFixed(1),stroke:"rgba(255,255,255,.45)","stroke-width":0.8}));}
      pl.appendChild(mk("line",{x1:a[0].toFixed(1),y1:a[1].toFixed(1),x2:ba[0].toFixed(1),y2:ba[1].toFixed(1),stroke:"#fff","stroke-width":2.4}));
      pl.appendChild(mk("line",{x1:b[0].toFixed(1),y1:b[1].toFixed(1),x2:bb[0].toFixed(1),y2:bb[1].toFixed(1),stroke:"#fff","stroke-width":2.4}));
      pl.appendChild(mk("line",{x1:ba[0].toFixed(1),y1:ba[1].toFixed(1),x2:bb[0].toFixed(1),y2:bb[1].toFixed(1),stroke:"#fff","stroke-width":2.4}));
      pl.appendChild(mk("line",{x1:a[0].toFixed(1),y1:a[1].toFixed(1),x2:b[0].toFixed(1),y2:b[1].toFixed(1),stroke:"#fff","stroke-width":2.4}));
    }
    drawGoal(0); drawGoal(1);
    $("vignette").setAttribute("d","M0 0 L400 0 L400 340 L0 340 Z");
    var c=P(0.5,0.5); $("pball").setAttribute("cx",c[0]); $("pball").setAttribute("cy",c[1]);
  }
  function tweenC(el,x,y,ms){return new Promise(function(res){var x0=+el.getAttribute("cx"),y0=+el.getAttribute("cy"),t0=performance.now();function s(t){var k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.setAttribute("cx",x0+(x-x0)*e);el.setAttribute("cy",y0+(y-y0)*e);if(k<1)requestAnimationFrame(s);else res();}requestAnimationFrame(s);});}
  function pmove(u,ms){var p=P(u,0.5);return tweenC($("pball"),p[0],p[1],ms);}
  function lightGlow(el,peak,hold){el.style.transition="opacity .3s";el.setAttribute("opacity",peak);clearTimeout(el._t);el._t=setTimeout(function(){el.setAttribute("opacity","0");},hold);}
  function hlBox(el,ms){el.style.transition="opacity .2s";el.setAttribute("opacity",".5");setTimeout(function(){el.setAttribute("opacity","0")},ms||850);}
  function ban(b,s,g){$("evB").textContent=b;$("evS").textContent=s||"";evb.classList.toggle("goal",!!g);evb.classList.add("on");setTimeout(function(){evb.classList.remove("on")},g?2400:1500);}
  function flash(){$("fl").classList.add("on");setTimeout(function(){$("fl").classList.remove("on")},360);}
  // ---- 실제 이벤트 영상 클립 재생 (실패 시 2D 연출로 폴백) ----
  var VID={goal:"",yellow:"",red:"",kickoff:""};
  function cardFallback(color,label,who){return new Promise(function(res){ban(label,who);var f=$("fl");f.style.background="radial-gradient(circle at 50% 42%,"+color+",transparent 62%)";f.classList.add("on");setTimeout(function(){f.classList.remove("on");f.style.background="";res();},1500);});}
  function playVid(kind,fallback){return new Promise(function(res){
    var v=$("evVid");var done=false,started=false;
    function finish(){if(done)return;done=true;v.classList.remove("on");v.onended=null;v.ontimeupdate=null;v.onplaying=null;setTimeout(function(){try{v.pause();}catch(e){}res();},280);}
    function fb(){if(done)return;done=true;v.classList.remove("on");v.onended=null;v.ontimeupdate=null;v.onplaying=null;try{v.pause();}catch(e){}(fallback?fallback():Promise.resolve()).then(res);}
    function reveal(){if(!done)v.classList.add("on");}   // 실제 프레임 나올 때만 표시 → 검은 로딩 제거
    v.onended=finish;
    v.onplaying=reveal;
    v.ontimeupdate=function(){if(v.currentTime>0.03){started=true;reveal();}};
    v.muted=true;try{v.removeAttribute("class");v.className="evvid";v.src=VID[kind];v.load();}catch(e){}
    var p=v.play();if(p&&p.catch)p.catch(function(){});
    setTimeout(function(){if(!started&&!done)fb();},750);            // 영상 재생 안되면 폴백
    setTimeout(function(){if(!done)finish();},kind==="goal"?9200:5200); // 안전 종료
  });}

  var S={hs:0,as:0,sh_h:0,sh_a:0,ot_h:0,ot_a:0,co_h:0,co_a:0,ps_h:50,pulse:15};

    $("ot_h").textContent=S.ot_h;$("ot_a").textContent=S.ot_a;set("ot",S.ot_h,S.ot_a);
    $("co_h").textContent=S.co_h;$("co_a").textContent=S.co_a;set("co",S.co_h,S.co_a);
    $("ps_h").textContent=S.ps_h+"%";$("ps_a").textContent=(100-S.ps_h)+"%";$("bh_ps").style.width=S.ps_h+"%";$("ba_ps").style.width=(100-S.ps_h)+"%";
  }
  function pulse(v,h){S.pulse=Math.max(0,Math.min(100,Math.round(v)));$("pn").textContent=S.pulse;$("pf").style.width=Math.max(8,S.pulse)+"%";if(h)$("story").innerHTML=h;}
  setInterval(function(){pulse(Math.max(8,S.pulse-1));},3000);

  // ---- build ball-in-net hero scene once ----
  function ael(p,tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
  var BX=210, BY=150;
  function buildBall(g,cx,cy,r){
    ael(g,"circle",{cx:cx+2,cy:cy+4,r:r+6,fill:"rgba(0,0,0,.4)"});               // 접지 그림자
    ael(g,"circle",{cx:cx,cy:cy,r:r,fill:"url(#ballSh)",stroke:"#0a0a0a","stroke-width":2}); // 구체 음영
    function poly(sc,rot,cx2,cy2,fill){var pts=[];for(var k=0;k<5;k++){var a=rot+k*2*Math.PI/5;pts.push((cx2+Math.cos(a)*sc).toFixed(1)+","+(cy2+Math.sin(a)*sc).toFixed(1));}ael(g,"polygon",{points:pts.join(" "),fill:fill||"#141414"});}

    for(var k=0;k<5;k++){var a=-Math.PI/2+k*2*Math.PI/5+Math.PI/5;poly(r*0.19,a+Math.PI,cx+Math.cos(a)*r*0.72,cy+Math.sin(a)*r*0.72);}  // 바깥 오각형
    for(var k=0;k<5;k++){var a=-Math.PI/2+k*2*Math.PI/5;ael(g,"line",{x1:(cx+Math.cos(a)*r*0.34).toFixed(1),y1:(cy+Math.sin(a)*r*0.34).toFixed(1),x2:(cx+Math.cos(a)*r*0.88).toFixed(1),y2:(cy+Math.sin(a)*r*0.88).toFixed(1),stroke:"#3a3f47","stroke-width":1.3});}  // 솔기
    ael(g,"circle",{cx:cx,cy:cy,r:r,fill:"url(#ballShade)"});                    // 우하단 음영(입체)
    ael(g,"circle",{cx:cx-r*0.30,cy:cy-r*0.33,r:r*0.46,fill:"url(#ballGloss)"}); // 부드러운 광택(구면)
    ael(g,"circle",{cx:cx,cy:cy,r:r,fill:"none",stroke:"rgba(255,255,255,.25)","stroke-width":1}); // 림 라이트
  }
  // ---- 3/4 3D goal: back-net grid billows backward along depth ----
  var G={FTL:[66,150],FTR:[312,166],FBL:[66,382],FBR:[312,362],dep:[38,-30],cols:11,rowN:8,rowEl:[],colEl:[]};
  G.BTL=[G.FTL[0]+G.dep[0],G.FTL[1]+G.dep[1]];G.BTR=[G.FTR[0]+G.dep[0],G.FTR[1]+G.dep[1]];
  G.BBL=[G.FBL[0]+G.dep[0],G.FBL[1]+G.dep[1]];G.BBR=[G.FBR[0]+G.dep[0],G.FBR[1]+G.dep[1]];

  function applyStaticLabels(){var s=$("lab_sh");if(s)s.textContent=CAP('lSh');var o=$("lab_ot");if(o)o.textContent=CAP('lOt');var c=$("lab_co");if(c)c.textContent=CAP('lCo');var p=$("lab_ps");if(p)p.textContent=CAP('lPs');var pl=$("pulseLab");if(pl)pl.textContent=CAP('lPulse');var st=$("storyLab");if(st)st.textContent=CAP('lStory');var ft=$("foot");if(ft)ft.textContent=CAP('lNote')+" · LIVE UP";}
  function t(o){return o[LG0]||o.en||o.ko;}
  function initials(n){if(!n)return"?";n=String(n).trim();var p=n.split(/\s+/);if(p.length>=2)return (p[0][0]+p[1][0]).toUpperCase();return n.slice(0,3).toUpperCase();}
  function perLabel(g){var s=String(g.status||'').toUpperCase();if(s==='HT')return'HT';if(/(FT|AET|PEN|END)/.test(s))return t(STR.fin);var e=g.elapsed;if(e==null)return'-';return e>45?t(STR.h2):t(STR.h1);}
  var last={hs:null,as:null,evKeys:{},done:false};
  async function getGame(){try{var r=await fetch(GAMES_API+'&_='+Date.now());var j=await r.json();return (j.games||[]).find(function(x){return String(x.id)===String(EV);});}catch(e){return null;}}
  async function getEvents(){if(!EV)return[];try{var r=await fetch(EVENTS_API+'&_='+Date.now());var j=await r.json();return j.events||[];}catch(e){return[];}}
  var STATS_API='/api/asports/fbstats?fixture='+encodeURIComponent(EV||'');
  function num(v){if(v==null)return 0;var m=String(v).replace('%','').trim();var n=parseInt(m,10);return isNaN(n)?0:n;}
  async function updateStats(g){ // 실제 누적 스탯 반영 (슈팅/유효슛/코너/점유율)
    try{
      var r=await fetch(STATS_API+'&_='+Date.now());var j=await r.json();var tm=j.teams||[];if(tm.length<2)return;
      var H=tm.find(function(x){return x.team===g.home;})||tm[0], A=tm.find(function(x){return x.team===g.away;})||tm[1];
      function pick(t,name){var s=(t.stats||[]).find(function(x){return x.type===name;});return s?num(s.value):0;}
      S.sh_h=pick(H,'Total Shots');S.sh_a=pick(A,'Total Shots');
      S.ot_h=pick(H,'Shots on Goal');S.ot_a=pick(A,'Shots on Goal');
      S.co_h=pick(H,'Corner Kicks');S.co_a=pick(A,'Corner Kicks');
      var ph=pick(H,'Ball Possession');if(ph)S.ps_h=ph;
      bars();
    }catch(e){}
  }
  function hydrate(g){
    if(g.home)$("hn").textContent=g.home; if(g.away)$("an").textContent=g.away;
    $("hb").textContent=initials(g.home); $("ab").textContent=initials(g.away);
    if(g.league)$("league").textContent=g.league;
    if(g.elapsed!=null)$("clk").textContent=g.elapsed+"'";
    $("per").textContent=perLabel(g);
  }
  async function tick(){
    var g=await getGame(); if(!g)return;
    hydrate(g);
    updateStats(g);
    var hs=g.hs||0, as=g.as||0;
    if(last.hs===null){ // 진입 시점 = 현재 스코어로 라이브 시작 (처음부터 재생 아님)
      S.hs=hs;S.as=as;$("hs").textContent=hs;$("as").textContent=as;last.hs=hs;last.as=as;
      pulse(45,t(STR.live)+" · "+g.home+" "+hs+" : "+as+" "+g.away);
      // 진입 시점 기준으로 기존 이벤트는 표시만 안하고 키만 등록
      (await getEvents()).forEach(function(ev){last.evKeys[evKey(ev)]=1;});
    } else {
      if(hs>last.hs){last.hs=hs;play("goal","home");}
      else if(as>last.as){last.as=as;play("goal","away");}
      else { // 점수 동기화(혹시 놓친 경우)
        if(hs!==S.hs){S.hs=hs;$("hs").textContent=hs;} if(as!==S.as){S.as=as;$("as").textContent=as;}
      }
      // 새 카드 이벤트(경고/퇴장)만 연출
      var evs=await getEvents();
      for(var i=0;i<evs.length;i++){var ev=evs[i],k=evKey(ev);if(last.evKeys[k])continue;last.evKeys[k]=1;
        var isHome=(ev.team===g.home); var d=(ev.detail||'').toLowerCase(), ty=(ev.type||'').toLowerCase();
        if(ty==='card'&&d.indexOf('yellow')>=0)play("yellow",isHome?"home":"away");
        else if(ty==='card'&&d.indexOf('red')>=0)play("red",isHome?"home":"away");
      }
    }
    var st=String(g.status||'').toUpperCase();
    if(/(FT|AET|PEN|END)/.test(st)&&!last.done){last.done=true;pulse(20,t(STR.fin)+" · "+g.home+" "+S.hs+" : "+S.as+" "+g.away);}
  }
  function evKey(ev){return (ev.minute||'')+'|'+(ev.team||'')+'|'+(ev.type||'')+'|'+(ev.detail||'')+'|'+(ev.player||'');}
  applyStaticLabels();
  if(EV){ pulse(15,t(STR.wait)); tick(); setInterval(tick,15000); }
  else { pulse(15,t(STR.wait)); }

  // ===== 로그인 게이트: 10초 시청 후 카드 전체 흐림 + 안내 (전 종목 동일) =====
  var GL=["en","ko","ja","zh","es","hi","vi","th","ru","de","fr","it"];
  var GT={
    title:["Sign in to keep watching","계속 보려면 로그인하세요","ログインして視聴を続ける","登录后继续观看","Inicia sesión para seguir viendo","देखना जारी रखने के लिए साइन इन करें","Đăng nhập để tiếp tục xem","เข้าสู่ระบบเพื่อดูต่อ","Войдите, чтобы продолжить","Zum Weiterschauen anmelden","Connectez-vous pour continuer","Accedi per continuare"],
    sub:["Log in in 3 seconds with one click!","단 한번 클릭으로 3초만에 로그인해보세요!","ワンクリックで3秒でログイン！","一键3秒登录！","¡Inicia sesión en 3 segundos con un clic!","एक क्लिक में 3 सेकंड में लॉगिन करें!","Đăng nhập trong 3 giây chỉ với một cú nhấp!","ล็อกอินใน 3 วินาทีด้วยคลิกเดียว!","Вход за 3 секунды одним кликом!","In 3 Sekunden mit einem Klick anmelden!","Connectez-vous en 3 secondes en un clic !","Accedi in 3 secondi con un clic!"],
    btn:["Log in","로그인","ログイン","登录","Iniciar sesión","लॉग इन","Đăng nhập","เข้าสู่ระบบ","Войти","Anmelden","Se connecter","Accedi"]
  };
  function glang(){var i=GL.indexOf(LG0);return i<0?0:i;}
  (function(){var i=glang();$("gateTitle").textContent=GT.title[i];$("gateSub").textContent=GT.sub[i];$("gateBtn").textContent=GT.btn[i];})();
  function isLogged(){try{return !!(localStorage.getItem("liveup_token")||localStorage.getItem("liveup_user"))}catch(e){return false}}
  var gateTimer=null, card=document.querySelector(".card");
  function armGate(){
    clearTimeout(gateTimer);card.classList.remove("locked");$("gate").classList.remove("on");
    if(isLogged())return;
    gateTimer=setTimeout(function(){card.classList.add("locked");$("gate").classList.add("on");try{Q.length=0;}catch(e){}},10000);
  }
  $("gateBtn").addEventListener("click",function(){
    try{ if(window.parent&&window.parent!==window&&window.parent.openLogin){window.parent.openLogin();return;} }catch(e){}
    card.classList.remove("locked");$("gate").classList.remove("on");armGate();
  });
  armGate();
})();
</script>
</body>
</html>
